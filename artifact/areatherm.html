<title>AreaTherm</title>
<style>
:root{
  --navy-900:#0b1a2b; --navy-800:#122840; --navy-700:#1a3a5c;
  --accent:#1f8a9e; --accent-bright:#2fb8cf;
  --bg:#f4f7f9; --panel:#ffffff; --border:#dfe6ec;
  --text:#152233; --text-muted:#5b6b7c; --text-faint:#8b98a6;
  --good:#1f9d55; --warn:#d98a12; --bad:#c93b3b;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--sans); background:var(--bg); color:var(--text); font-size:14px;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}

.app-shell{min-height:100vh;}

/* Sidebar */
.sidebar{
  width:230px; background:linear-gradient(180deg,var(--navy-900),var(--navy-800));
  color:#dce8f0; display:flex; flex-direction:column; flex-shrink:0; padding:18px 0;
  position:fixed; top:0; left:0; height:100vh; z-index:10;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 18px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{width:34px; height:34px; border-radius:8px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;}
.brand-name{font-weight:700; font-size:15px; color:#fff;}
.brand-sub{font-size:10.5px; color:#8ea9bc; letter-spacing:.03em;}
.nav{display:flex; flex-direction:column; padding:14px 10px; gap:2px; flex:1; overflow-y:auto;}
.nav a{padding:9px 12px; border-radius:6px; font-size:13px; color:#b9cad8; transition:background .12s;}
.nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav a.active{background:var(--accent); color:#fff; font-weight:600;}
.sidebar-footer{padding:14px 18px 0; border-top:1px solid rgba(255,255,255,.08); margin-top:8px;}
.mode-toggle{display:flex; background:rgba(255,255,255,.08); border-radius:6px; padding:2px; margin-bottom:10px;}
.mode-btn{flex:1; background:transparent; border:none; color:#b9cad8; font-size:11.5px; padding:6px 0; border-radius:5px;}
.mode-btn.active{background:var(--accent); color:#fff;}
.version-tag{font-family:var(--mono); font-size:10px; color:#63798c;}

/* Main content */
.content{margin-left:230px; min-width:0; display:flex; flex-direction:column; min-height:100vh;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 24px; background:var(--panel); border-bottom:1px solid var(--border);}
.topbar-project{display:flex; flex-direction:column;}
.topbar-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);}
.topbar-value{font-weight:600; font-size:14px;}
.btn{border:1px solid var(--border); background:var(--panel); padding:8px 14px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--text);}
.btn:hover{border-color:var(--accent); color:var(--accent);}
.btn-accent{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn-accent:hover{background:var(--accent-bright); color:#fff;}
.btn-sm{padding:5px 10px; font-size:11.5px;}

.view{padding:22px 26px 60px; max-width:1320px;}

/* Typography helpers */
h1{font-size:21px; margin:0 0 4px;}
h2{font-size:16px; margin:0 0 12px;}
h3{font-size:13.5px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted);}
.subtitle{color:var(--text-muted); font-size:13px; margin-bottom:20px;}
.tag{display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:999px; font-weight:700;}
.tag-demo{background:#fdf0d8; color:#8a5a10;}
.tag-model{background:#dff1f5; color:#166273;}
.tag-input{background:#e6f4ea; color:#1c7a3d;}
.tag-field{background:#f0e6f9; color:#6b2fa3;}

/* Grid / cards */
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px 18px;}
.card-tight{padding:12px 14px;}
.metric-card .metric-label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
.metric-card .metric-value{font-size:26px; font-weight:700; font-family:var(--mono);}
.metric-card .metric-sub{font-size:11.5px; color:var(--text-faint); margin-top:4px;}

/* Forms */
.form-row{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.form-row label{font-size:11.5px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.02em;}
.form-row input, .form-row select, .form-row textarea{
  padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:#fff; color:var(--text); font-family:inherit;
}
.form-row .hint{font-size:11px; color:var(--text-faint); font-weight:400; text-transform:none;}
.form-inline{display:flex; gap:12px; flex-wrap:wrap;}
.form-inline .form-row{flex:1; min-width:140px;}
fieldset{border:1px solid var(--border); border-radius:8px; padding:14px; margin:0 0 16px;}
legend{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--accent); padding:0 6px;}

/* Tables */
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th,td{padding:8px 10px; border-bottom:1px solid var(--border); text-align:left;}
th{font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); background:#f8fafb;}
tr.highlight-recommended{background:#e9f8ee;}
td.num{font-family:var(--mono); text-align:right;}
.table-wrap{overflow-x:auto;}

/* Charts */
.chart-svg{width:100%; height:auto; display:block;}
.chart-grid{stroke:#e7edf1; stroke-width:1;}
.chart-axis{stroke:#c4d0d9; stroke-width:1;}
.chart-tick{font-size:9.5px; fill:var(--text-faint); font-family:var(--mono);}
.chart-axis-label{font-size:10px; fill:var(--text-muted);}
.chart-line{fill:none; stroke-width:2;}
.chart-comfort-band{fill:#d7f3e3; opacity:.6;}
.chart-legend{display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;}
.chart-legend-item{font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:5px;}
.chart-legend-item i{width:10px; height:10px; border-radius:2px; display:inline-block;}
.chart-bar-pos{fill:var(--good);} .chart-bar-neg{fill:var(--bad);}
.chart-ideal-line{stroke:#c4d0d9; stroke-dasharray:4 3;}
.chart-point{fill:var(--accent); opacity:.75;}

.gauge-svg{width:140px; height:140px;}
.gauge-track{stroke:#e7edf1;}
.gauge-score{font-size:30px; font-weight:800; font-family:var(--mono); fill:var(--text);}
.gauge-max{font-size:11px; fill:var(--text-faint);}
.gauge-sublabel{text-align:center; font-size:11px; color:var(--text-muted); margin-top:4px;}

/* Heat flow diagram */
.heatflow{display:flex; flex-direction:column; align-items:stretch; gap:2px; max-width:640px;}
.heatflow-row{display:grid; grid-template-columns:170px 1fr 140px; align-items:center; gap:10px;}
.heatflow-label{font-size:11px; font-weight:700; letter-spacing:.02em; color:var(--text-muted);}
.heatflow-bar-track{background:#eef2f5; border-radius:4px; height:16px; overflow:hidden;}
.heatflow-bar{height:100%; border-radius:4px;}
.heatflow-bar.pos{background:var(--good);} .heatflow-bar.neg{background:var(--bad);}
.heatflow-value{font-family:var(--mono); font-size:12px; text-align:right;}
.heatflow-value.pos{color:var(--good);} .heatflow-value.neg{color:var(--bad);}
.heatflow-arrow{text-align:left; padding-left:6px; color:var(--text-faint); font-size:12px;}
.heatflow-net{border-top:1px dashed var(--border); padding-top:6px; margin-top:4px;}

/* Score badges / checklist */
.score-pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-weight:700;}
.checklist{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px;}
.checklist li{font-size:13px;}
.checklist li::before{content:"✓ "; color:var(--good); font-weight:700;}

/* Recommended design panel */
.recommend-panel{border:1.5px solid var(--good); background:#f3fbf5; border-radius:10px; padding:18px 20px;}
.recommend-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:10px;}
.recommend-item .k{font-size:10.5px; text-transform:uppercase; color:var(--text-muted); letter-spacing:.03em;}
.recommend-item .v{font-weight:700; font-size:14px;}

/* Explain link */
.explain-link{font-size:11px; color:var(--accent); font-weight:600; border:1px dashed var(--accent); border-radius:5px; padding:2px 8px; display:inline-block; margin-top:6px;}
.explain-link:hover{background:var(--accent); color:#fff;}

/* Modal */
.modal-overlay{position:fixed; inset:0; background:rgba(10,20,30,.5); display:flex; align-items:center; justify-content:center; z-index:100;}
.modal-overlay.hidden{display:none;}
.modal{background:#fff; border-radius:10px; width:640px; max-width:92vw; max-height:82vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-header{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border);}
.modal-close{background:none; border:none; font-size:16px; color:var(--text-muted);}
.modal-body{padding:16px 20px; overflow-y:auto; font-size:13px; line-height:1.6;}
.modal-body pre{background:#f4f7f9; padding:12px; border-radius:6px; font-family:var(--mono); font-size:12.5px; overflow-x:auto;}

/* Landing hero */
.hero{background:linear-gradient(135deg,var(--navy-900),var(--navy-700)); color:#fff; border-radius:14px; padding:36px 40px; margin-bottom:22px;}
.hero h1{font-size:28px; color:#fff; margin-bottom:8px;}
.hero p{color:#c3d6e2; max-width:640px; font-size:14px; line-height:1.6;}
.hero .flow{display:flex; align-items:center; gap:8px; margin-top:20px; flex-wrap:wrap; font-family:var(--mono); font-size:12px;}
.hero .flow span.step{background:rgba(255,255,255,.1); padding:6px 12px; border-radius:6px; color:#e7f1f7;}
.hero .flow span.arrow{color:#6f93aa;}
.hero .cta-row{margin-top:22px; display:flex; gap:10px;}

.workflow-compare{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:18px 0;}
.workflow-col{border-radius:10px; padding:16px 18px;}
.workflow-col.old{background:#fbeceb; border:1px solid #f1c6c2;}
.workflow-col.new{background:#eaf7ee; border:1px solid #bfe6cb;}
.workflow-col .step{padding:6px 0; font-size:12.5px; font-weight:600;}
.workflow-col .arrow-down{text-align:center; color:var(--text-faint); font-size:12px;}

.assumption-list{list-style:none; margin:0; padding:0;}
.assumption-list li{padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px;}
.assumption-list li:last-child{border-bottom:none;}

.badge-source{font-size:10.5px; padding:2px 7px; border-radius:5px; font-weight:700; text-transform:uppercase;}

@media print{
  .sidebar, .topbar, .btn, .explain-link{display:none !important;}
  .content{width:100%; margin-left:0;}
  .view{padding:0; max-width:100%;}
  body{background:#fff;}
}
</style>

window.U = {
  n(x, d) { d = d == null ? 1 : d; return Number.isFinite(x) ? x.toFixed(d) : "—"; },
  qs(sel, root) { return (root || document).querySelector(sel); },
  qsa(sel, root) { return Array.from((root || document).querySelectorAll(sel)); },
  on(sel, evt, fn, root) { const e = this.qs(sel, root); if (e) e.addEventListener(evt, fn); },
  esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
};

<script>
/* AreaTherm — Thermal Engine + Optimization Engine + Validation Stats.
   Pure functions only (no DOM access) so this module ports directly onto
   a Spring Boot `thermal` / `optimization` service. */

window.APP_ENGINE = (function () {
  const CFG = window.APP_CONFIG;
  const DATA = window.APP_DATA;
  const AIR_RHO = CFG.PHYSICS.AIR_DENSITY_KG_M3;
  const AIR_CP = CFG.PHYSICS.AIR_CP_J_KGK;
  const H_O = CFG.PHYSICS.OUTSIDE_FILM_COEFF_W_M2K;
  const H_MASS = CFG.PHYSICS.MASS_FILM_COEFF_W_M2K;
  const RSI_WALL = 0.13, RSI_ROOF = 0.10, R_GROUND = 0.50;

  const ORIENT_OFFSET = { SOUTH: 0, SE: 45, EAST: 90, NE: 135, NORTH: 180, NW: 135, WEST: 90, SW: 45 };
  const FACTOR_TABLE = [ [0, 1.00], [45, 0.85], [90, 0.55], [135, 0.30], [180, 0.15] ];

  function orientationFactorFromAngle(angle0to180) {
    const a = Math.max(0, Math.min(180, angle0to180));
    for (let i = 0; i < FACTOR_TABLE.length - 1; i++) {
      const [a0, f0] = FACTOR_TABLE[i], [a1, f1] = FACTOR_TABLE[i + 1];
      if (a >= a0 && a <= a1) {
        const t = (a - a0) / (a1 - a0);
        return f0 + t * (f1 - f0);
      }
    }
    return 0.15;
  }

  function frontAzimuthOf(design) {
    if (design.orientation === "CUSTOM") return ((design.azimuthDeg % 360) + 360) % 360;
    return ORIENT_OFFSET[design.orientation] ?? 0;
  }

  function faceFactor(frontAzimuth, relativeOffsetDeg) {
    const abs = ((frontAzimuth + relativeOffsetDeg) % 360 + 360) % 360;
    const angle = abs <= 180 ? abs : 360 - abs;
    return orientationFactorFromAngle(angle);
  }

  function computeGeometry(design) {
    let L = design.length || 6, W = design.width || 4, H = design.height || 3;
    let floorArea, roofArea, perimeter;
    if (design.shape === "CIRCULAR" || design.shape === "DOME" || design.shape === "SEMI_CIRCULAR") {
      const d = design.diameter || Math.max(L, W) || 5;
      const r = d / 2;
      floorArea = Math.PI * r * r;
      perimeter = Math.PI * d;
      roofArea = (design.shape === "DOME") ? 2 * Math.PI * r * r : floorArea;
      L = W = d;
    } else {
      if (design.shape === "SQUARE") { W = L; }
      floorArea = L * W;
      perimeter = 2 * (L + W);
      roofArea = L * W;
    }
    const volume = floorArea * H;
    const frontAzimuth = frontAzimuthOf(design);
    let faces;
    if (design.shape === "CIRCULAR" || design.shape === "DOME" || design.shape === "SEMI_CIRCULAR") {
      const wallArea = perimeter * H;
      faces = [{ name: "CURVED_WALL", areaM2: wallArea, factor: faceFactor(frontAzimuth, 0) }];
    } else {
      faces = [
        { name: "FRONT", areaM2: L * H, factor: faceFactor(frontAzimuth, 0) },
        { name: "BACK", areaM2: L * H, factor: faceFactor(frontAzimuth, 180) },
        { name: "LEFT", areaM2: W * H, factor: faceFactor(frontAzimuth, -90) },
        { name: "RIGHT", areaM2: W * H, factor: faceFactor(frontAzimuth, 90) }
      ];
    }
    const wallArea = faces.reduce((s, f) => s + f.areaM2, 0);
    return { L, W, H, floorArea, roofArea, wallArea, volume, faces, frontAzimuth };
  }

  function layerResistance(materialId, thicknessMm) {
    const m = DATA.materialById(materialId);
    if (!m || !m.k) return 0;
    return (thicknessMm / 1000) / m.k;
  }

  function wallUValue(design) {
    let R = RSI_WALL + 1 / H_O;
    R += layerResistance(design.wall.materialId, design.wall.thicknessMm);
    if (design.wall.insulationMaterialId && design.wall.insulationThicknessMm) {
      R += layerResistance(design.wall.insulationMaterialId, design.wall.insulationThicknessMm);
    }
    return 1 / R;
  }
  function roofUValue(design) {
    let R = RSI_ROOF + 1 / H_O;
    R += layerResistance(design.roof.materialId, design.roof.thicknessMm);
    if (design.roof.insulationMaterialId && design.roof.insulationThicknessMm) {
      R += layerResistance(design.roof.insulationMaterialId, design.roof.insulationThicknessMm);
    }
    return 1 / R;
  }
  function floorUValue(design) {
    const mat = DATA.materialById(design.floor.materialId);
    const thicknessMm = design.floor.thicknessMm || 150;
    let R = R_GROUND + (mat && mat.k ? (thicknessMm / 1000) / mat.k : 0.1);
    return 1 / R;
  }
  function windowUValue(win) {
    const g = DATA.materialById(win.glazingMaterialId);
    return g ? g.uValue : 2.8;
  }

  function ambientTempAt(season, hourDecimal) {
    const mean = (season.tMin + season.tMax) / 2;
    const amp = (season.tMax - season.tMin) / 2;
    const rad = ((hourDecimal - 15) / 24) * 2 * Math.PI;
    return mean + amp * Math.cos(rad);
  }

  function solarIrradianceAt(season, hourDecimal) {
    const { sunrise, sunset, solarKwhDay } = season;
    if (hourDecimal <= sunrise || hourDecimal >= sunset) return 0;
    const dayLen = sunset - sunrise;
    const x = (hourDecimal - sunrise) / dayLen;
    const shape = Math.sin(Math.PI * x);
    const peakWm2 = (solarKwhDay * 1000) / (dayLen * (2 / Math.PI));
    return Math.max(0, shape * peakWm2);
  }

  function runSimulation(design, season, simConfig) {
    const geom = computeGeometry(design);
    const uWall = wallUValue(design), uRoof = roofUValue(design), uFloor = floorUValue(design);
    const windowGroups = (design.windows || []).map(w => ({
      ...w, uValue: windowUValue(w), shgc: (DATA.materialById(w.glazingMaterialId) || {}).shgc || 0.7,
      totalArea: (w.areaEach || 0) * (w.count || 0)
    }));
    const doorArea = (design.doors || []).reduce((s, d) => s + (d.areaEach || 0) * (d.count || 0), 0);
    const windowArea = windowGroups.reduce((s, w) => s + w.totalArea, 0);
    const netWallArea = Math.max(0, geom.wallArea - windowArea - doorArea);

    const windFactor = 1 + Math.min(0.6, (season.windMs || 2) * 0.06);
    const ach = (design.airLeakageAch || 0.6) * windFactor;

    const tm = design.thermalMass;
    let massActive = !!(tm && tm.massKg > 0);
    const massMat = massActive ? DATA.materialById(tm.materialId) : null;
    let cMass = massActive ? tm.massKg * (massMat.cp || 900) : 0;
    const massArea = massActive ? (tm.surfaceAreaM2 || 5) : 0;
    const isPcm = massActive && massMat && massMat.pcmMeltC != null;

    const cAir = geom.volume * AIR_RHO * AIR_CP * CFG.PHYSICS.FURNISHING_CAPACITANCE_FACTOR;

    const dtSec = (simConfig.timeStepMinutes || 60) * 60;
    const stepsPerDay = Math.round(24 * 3600 / dtSec);
    const totalSteps = stepsPerDay * (simConfig.days || 1);

    let tAir = (season.tMin + season.tMax) / 2;
    let tMass = tAir;
    const series = [];
    const agg = { solarKwh: 0, wallLossKwh: 0, roofLossKwh: 0, floorLossKwh: 0, openingCondLossKwh: 0,
      ventLossKwh: 0, massExchangeKwh: 0, internalKwh: 0, comfortSteps: 0, heatingReqKwh: 0, coolingReqKwh: 0,
      incidentOnWindowKwh: 0 };

    for (let i = 0; i < totalSteps; i++) {
      const hourDecimal = (i * dtSec / 3600) % 24;
      const tAmb = ambientTempAt(season, hourDecimal);
      const gHoriz = solarIrradianceAt(season, hourDecimal);

      const wallMat = DATA.materialById(design.wall.materialId) || { absorptivity: 0.6 };
      let wallUA = 0, wallRefSum = 0;
      geom.faces.forEach(f => {
        const gFace = gHoriz * f.factor;
        const tSolAir = tAmb + (wallMat.absorptivity * gFace) / H_O;
        wallUA += uWall * f.areaM2;
        wallRefSum += uWall * f.areaM2 * tSolAir;
      });
      const roofMat = DATA.materialById(design.roof.materialId) || { absorptivity: 0.6 };
      const tSolAirRoof = tAmb + (roofMat.absorptivity * gHoriz) / H_O;
      const roofUA = uRoof * geom.roofArea, roofRef = roofUA * tSolAirRoof;
      const tGround = design.groundTempC ?? (season.tMin + season.tMax) / 2;
      const floorUA = uFloor * geom.floorArea, floorRef = floorUA * tGround;

      let qSolarWindow = 0, windowCondUA = 0;
      windowGroups.forEach(w => {
        const off = { FRONT: 0, BACK: 180, LEFT: -90, RIGHT: 90, PRIMARY: 0 }[w.orientation] ?? 0;
        const f = faceFactor(geom.frontAzimuth, off);
        qSolarWindow += w.totalArea * gHoriz * f * w.shgc;
        windowCondUA += w.uValue * w.totalArea;
      });
      const windowCondRef = windowCondUA * tAmb;
      const doorUA = 1.8 * doorArea, doorRef = doorUA * tAmb;
      const ventUA = (ach * geom.volume / 3600) * AIR_RHO * AIR_CP, ventRef = ventUA * tAmb;
      const qInternal = design.internalHeatGainW || 0;
      const massUA = massActive ? H_MASS * massArea : 0, massRef = massUA * tMass;

      const totalUA = wallUA + roofUA + floorUA + windowCondUA + doorUA + ventUA + massUA;
      const totalRef = wallRefSum + roofRef + floorRef + windowCondRef + doorRef + ventRef + massRef + qSolarWindow + qInternal;
      const cDt = cAir / dtSec;
      const nextTair = (cDt * tAir + totalRef) / (cDt + totalUA);

      const qWall = wallUA * nextTair - wallRefSum;
      const qRoof = roofUA * nextTair - roofRef;
      const qFloor = floorUA * nextTair - floorRef;
      const qWindowCond = windowCondUA * nextTair - windowCondRef;
      const qDoorCond = doorUA * nextTair - doorRef;
      const qVent = ventUA * nextTair - ventRef;
      const qMassExchange = massUA * (nextTair - tMass);

      let nextTmass = tMass;
      if (massActive) {
        const solarToMass = 0.25 * qSolarWindow;
        let effectiveCMass = cMass;
        if (isPcm && Math.abs(tMass - massMat.pcmMeltC) < 1.5) {
          effectiveCMass = cMass + (tm.massKg * massMat.pcmLatentJKg) / 3;
        }
        const cMassDt = effectiveCMass / dtSec;
        nextTmass = (cMassDt * tMass + massUA * nextTair + solarToMass) / (cMassDt + massUA);
      }

      const inComfort = nextTair >= design.comfort.min && nextTair <= design.comfort.max;
      if (inComfort) agg.comfortSteps++;
      if (nextTair < design.comfort.min) {
        agg.heatingReqKwh += ((uWall * geom.wallArea + uRoof * geom.roofArea + uFloor * geom.floorArea + qVentUA(ach, geom.volume)) * (design.comfort.min - nextTair) * dtSec) / 3.6e6;
      }
      if (nextTair > design.comfort.max) {
        agg.coolingReqKwh += ((uWall * geom.wallArea + uRoof * geom.roofArea) * (nextTair - design.comfort.max) * dtSec) / 3.6e6;
      }

      const qNetAir = qSolarWindow + qInternal - qMassExchange - qWall - qRoof - qFloor - qWindowCond - qDoorCond - qVent;
      series.push({
        hourDecimal, stepIndex: i, tAmb: round2(tAmb), tIndoor: round2(nextTair), tMass: round2(nextTmass),
        gHoriz: round2(gHoriz), qSolarWindow: round2(qSolarWindow), qWall: round2(qWall), qRoof: round2(qRoof),
        qFloor: round2(qFloor), qWindowCond: round2(qWindowCond), qDoorCond: round2(qDoorCond), qVent: round2(qVent),
        qMassExchange: round2(qMassExchange), qInternal: round2(qInternal), qNet: round2(qNetAir), inComfort
      });

      agg.solarKwh += (qSolarWindow * dtSec) / 3.6e6;
      agg.wallLossKwh += Math.max(0, (qWall * dtSec) / 3.6e6);
      agg.roofLossKwh += Math.max(0, (qRoof * dtSec) / 3.6e6);
      agg.floorLossKwh += Math.max(0, (qFloor * dtSec) / 3.6e6);
      agg.openingCondLossKwh += Math.max(0, ((qWindowCond + qDoorCond) * dtSec) / 3.6e6);
      agg.ventLossKwh += Math.max(0, (qVent * dtSec) / 3.6e6);
      agg.massExchangeKwh += (qMassExchange * dtSec) / 3.6e6;
      agg.internalKwh += (qInternal * dtSec) / 3.6e6;
      agg.incidentOnWindowKwh += (gHoriz * windowArea * dtSec) / 3.6e6;

      tAir = nextTair;
      tMass = nextTmass;
    }

    function qVentUA(achV, volume) { return (achV * volume / 3600) * AIR_RHO * AIR_CP; }

    const totalDays = simConfig.days || 1;
    const comfortHoursPerDay = (agg.comfortSteps * (dtSec / 3600)) / totalDays;
    const nightSteps = series.filter(s => s.hourDecimal < 6 || s.hourDecimal >= 20);
    const daySteps = series.filter(s => s.hourDecimal >= 6 && s.hourDecimal < 20);
    const nightComfortPct = pct(nightSteps.filter(s => s.inComfort).length, nightSteps.length);
    const dayComfortPct = pct(daySteps.filter(s => s.inComfort).length, daySteps.length);

    const totalLossKwh = agg.wallLossKwh + agg.roofLossKwh + agg.floorLossKwh + agg.openingCondLossKwh + agg.ventLossKwh;
    const solarUtilizationPct = agg.incidentOnWindowKwh > 0.001 ? clamp(pct(agg.solarKwh, agg.incidentOnWindowKwh), 0, 100) : 0;
    const heatRetentionPct = clamp(pct(agg.solarKwh + agg.internalKwh + Math.max(0, -agg.massExchangeKwh), totalLossKwh), 0, 100);

    const comfortScore = clamp(0.5 * dayComfortPct + 0.5 * nightComfortPct, 0, 100);
    const energyDemandPerDay = (agg.heatingReqKwh + agg.coolingReqKwh) / totalDays;
    const energyAdequacyPct = clamp(100 - energyDemandPerDay * 1.5, 0, 100);
    const thermalComfortScore = Math.round(
      0.45 * comfortScore + 0.25 * heatRetentionPct + 0.20 * solarUtilizationPct + 0.10 * energyAdequacyPct
    );

    const minIndoor = Math.min(...series.map(s => s.tIndoor));
    const maxIndoor = Math.max(...series.map(s => s.tIndoor));

    return {
      geometry: geom, uValues: { wall: uWall, roof: uRoof, floor: uFloor },
      netWallArea, windowArea, doorArea, series,
      daily: {
        solarKwh: round2(agg.solarKwh / totalDays), wallLossKwh: round2(agg.wallLossKwh / totalDays),
        roofLossKwh: round2(agg.roofLossKwh / totalDays), floorLossKwh: round2(agg.floorLossKwh / totalDays),
        openingLossKwh: round2(agg.openingCondLossKwh / totalDays), ventLossKwh: round2(agg.ventLossKwh / totalDays),
        massExchangeKwh: round2(agg.massExchangeKwh / totalDays), internalKwh: round2(agg.internalKwh / totalDays),
        totalLossKwh: round2(totalLossKwh / totalDays),
        netKwh: round2((agg.solarKwh + agg.internalKwh - totalLossKwh) / totalDays),
        heatingReqKwh: round2(agg.heatingReqKwh / totalDays), coolingReqKwh: round2(agg.coolingReqKwh / totalDays)
      },
      comfort: {
        comfortHoursPerDay: round2(comfortHoursPerDay), dayComfortPct: round2(dayComfortPct),
        nightComfortPct: round2(nightComfortPct), minIndoor: round2(minIndoor), maxIndoor: round2(maxIndoor)
      },
      scores: {
        comfortScore: round2(comfortScore), heatRetentionPct: round2(heatRetentionPct),
        solarUtilizationPct: round2(solarUtilizationPct), thermalComfortScore: clamp(thermalComfortScore, 0, 100)
      }
    };
  }

  function round2(x) { return Math.round(x * 100) / 100; }
  function pct(n, d) { return d > 0 ? (100 * n / d) : 0; }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

  function estimateCost(design) {
    const geom = computeGeometry(design);
    const wallMat = DATA.materialById(design.wall.materialId) || {};
    const roofMat = DATA.materialById(design.roof.materialId) || {};
    const insMat = design.wall.insulationMaterialId ? DATA.materialById(design.wall.insulationMaterialId) : null;
    let cost = 0;
    cost += (wallMat.costPerM2 || 1000) * geom.wallArea;
    cost += (roofMat.costPerM2 || 1200) * geom.roofArea;
    if (insMat) cost += (insMat.costPerM2 || 500) * geom.wallArea * ((design.wall.insulationThicknessMm || 0) / 75);
    (design.windows || []).forEach(w => {
      const g = DATA.materialById(w.glazingMaterialId) || {};
      cost += (g.costPerM2 || 2000) * (w.areaEach || 0) * (w.count || 0);
    });
    if (design.thermalMass && design.thermalMass.massKg) {
      const m = DATA.materialById(design.thermalMass.materialId) || {};
      cost += (m.costPerKg || 5) * design.thermalMass.massKg;
    }
    return Math.round(cost);
  }

  function cloneDesign(d) { return JSON.parse(JSON.stringify(d)); }

  function generateCandidates(baseDesign) {
    const orientations = ["SOUTH", "SE", "SW", "EAST"];
    const insulationMm = [50, 75, 100, 150];
    const windowPct = [0.08, 0.12, 0.16, 0.20];
    const glazings = ["glaze_single", "glaze_double", "glaze_triple", "glaze_lowe"];
    const massLevels = [0, 400, 900, 1600];

    const candidates = [];
    let n = 0;
    for (const orient of orientations) {
      for (const insul of insulationMm) {
        for (const wpct of windowPct) {
          for (const glz of glazings) {
            for (const mass of massLevels) {
              n++;
              if (n % 3 !== 0 && candidates.length > 0) continue;
              const d = cloneDesign(baseDesign);
              d.orientation = orient === "SOUTH" || orient === "EAST" ? orient : "CUSTOM";
              if (orient === "SE") { d.orientation = "CUSTOM"; d.azimuthDeg = 45; }
              if (orient === "SW") { d.orientation = "CUSTOM"; d.azimuthDeg = 315; }
              if (orient === "SOUTH") d.azimuthDeg = 0;
              if (orient === "EAST") d.azimuthDeg = 90;
              d.wall.insulationMaterialId = d.wall.insulationMaterialId || "ins_puf";
              d.wall.insulationThicknessMm = insul;
              d.roof.insulationMaterialId = d.roof.insulationMaterialId || "ins_puf";
              d.roof.insulationThicknessMm = insul;
              const geom0 = computeGeometry(d);
              const targetWindowArea = geom0.wallArea * wpct;
              d.windows = [{ areaEach: round2(targetWindowArea), count: 1, orientation: "FRONT", glazingMaterialId: glz }];
              if (mass > 0) {
                d.thermalMass = { materialId: "mass_composite", massKg: mass, surfaceAreaM2: Math.min(geom0.floorArea, mass / 300) };
              } else {
                d.thermalMass = null;
              }
              candidates.push({ design: d, params: { orient, insul, wpct, glz, mass } });
              if (candidates.length >= 60) return candidates;
            }
          }
        }
      }
    }
    return candidates;
  }

  function scoreCandidate(result, cost, weights, costRange, energyRange) {
    const comfort = result.scores.comfortScore;
    const retention = result.scores.heatRetentionPct;
    const solar = result.scores.solarUtilizationPct;
    const energyDemand = result.daily.heatingReqKwh + result.daily.coolingReqKwh;
    energyRange = energyRange || { min: energyDemand * 0.7, max: energyDemand * 1.3 };
    const energyScore = energyRange.max > energyRange.min
      ? clamp(100 * (1 - (energyDemand - energyRange.min) / (energyRange.max - energyRange.min)), 0, 100)
      : 100;
    const costScore = costRange.max > costRange.min
      ? clamp(100 * (1 - (cost - costRange.min) / (costRange.max - costRange.min)), 0, 100)
      : 100;
    const total = weights.comfort * comfort + weights.retention * retention + weights.solar * solar +
      weights.energy * energyScore + weights.cost * costScore;
    return { comfort, retention, solar, energyScore, costScore, energyDemand, total: round2(total) };
  }

  function runOptimization(baseDesign, season, simConfig, weights) {
    const rawCandidates = generateCandidates(baseDesign);
    const evaluated = rawCandidates.map(c => {
      const result = runSimulation(c.design, season, simConfig);
      const cost = estimateCost(c.design);
      return { ...c, result, cost };
    });
    const costs = evaluated.map(e => e.cost);
    const costRange = { min: Math.min(...costs), max: Math.max(...costs) };
    const demands = evaluated.map(e => e.result.daily.heatingReqKwh + e.result.daily.coolingReqKwh);
    const energyRange = { min: Math.min(...demands), max: Math.max(...demands) };
    evaluated.forEach(e => { e.score = scoreCandidate(e.result, e.cost, weights, costRange, energyRange); });
    evaluated.sort((a, b) => b.score.total - a.score.total);
    const top = evaluated.slice(0, 5);
    const labels = ["A", "B", "C", "D", "E"];
    top.forEach((e, i) => { e.label = labels[i]; e.isRecommended = i === 0; });
    return { candidatesEvaluated: evaluated.length, top, recommended: top[0] };
  }

  function sensitivityAnalysis(baseDesign, season, simConfig, weights) {
    const baseResult = runSimulation(baseDesign, season, simConfig);
    const baseCost = estimateCost(baseDesign);
    const baseScore = scoreCandidate(baseResult, baseCost, weights, { min: baseCost * 0.7, max: baseCost * 1.3 }).total;

    const perturbations = [
      { key: "Insulation thickness", apply: d => { d.wall.insulationThicknessMm = (d.wall.insulationThicknessMm || 75) + 50; d.roof.insulationThicknessMm = (d.roof.insulationThicknessMm || 75) + 50; } },
      { key: "Orientation", apply: d => { d.orientation = "SOUTH"; d.azimuthDeg = 0; } },
      { key: "Window area", apply: d => { (d.windows || []).forEach(w => w.areaEach *= 1.5); } },
      { key: "Thermal mass", apply: d => { d.thermalMass = { materialId: "mass_composite", massKg: 1200, surfaceAreaM2: 6 }; } },
      { key: "Wall material", apply: d => { d.wall.materialId = "wall_composite"; } },
      { key: "Glazing type", apply: d => { (d.windows || []).forEach(w => w.glazingMaterialId = "glaze_triple"); } },
      { key: "Shelter volume", apply: d => { d.height = (d.height || 3) * 1.15; } }
    ];

    const impacts = perturbations.map(p => {
      const d = cloneDesign(baseDesign);
      p.apply(d);
      const result = runSimulation(d, season, simConfig);
      const cost = estimateCost(d);
      const score = scoreCandidate(result, cost, weights, { min: cost * 0.7, max: cost * 1.3 }).total;
      return { parameter: p.key, deltaScore: round2(score - baseScore) };
    }).sort((a, b) => Math.abs(b.deltaScore) - Math.abs(a.deltaScore));

    return { baseScore: round2(baseScore), impacts };
  }

  function validationStats(points) {
    const n = points.length;
    if (n === 0) return null;
    const errs = points.map(p => p.predicted - p.measured);
    const mae = errs.reduce((s, e) => s + Math.abs(e), 0) / n;
    const rmse = Math.sqrt(errs.reduce((s, e) => s + e * e, 0) / n);
    const mape = points.reduce((s, p) => s + Math.abs((p.predicted - p.measured) / (p.measured || 1e-6)), 0) / n * 100;
    const meanMeasured = points.reduce((s, p) => s + p.measured, 0) / n;
    const ssTot = points.reduce((s, p) => s + Math.pow(p.measured - meanMeasured, 2), 0);
    const ssRes = points.reduce((s, p) => s + Math.pow(p.measured - p.predicted, 2), 0);
    const r2 = ssTot > 0 ? 1 - ssRes / ssTot : null;
    return { mae: round2(mae), rmse: round2(rmse), mape: round2(mape), r2: r2 !== null ? Math.round(r2 * 1000) / 1000 : null, n };
  }

  return {
    computeGeometry, wallUValue, roofUValue, floorUValue, windowUValue,
    ambientTempAt, solarIrradianceAt, runSimulation, estimateCost,
    generateCandidates, scoreCandidate, runOptimization, sensitivityAnalysis,
    validationStats, orientationFactorFromAngle, faceFactor, frontAzimuthOf
  };
})();
</script>

<script>
/* AreaTherm — dependency-free inline-SVG chart helpers. */
window.APP_CHARTS = (function () {
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function textEl(x, y, text, cls, anchor) {
    const t = el("text", { x, y, class: cls || "chart-label", "text-anchor": anchor || "start" });
    t.textContent = text;
    return t;
  }

  function niceRange(min, max) {
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * 0.1;
    return [min - pad, max + pad];
  }

  function lineChart(container, series, opts) {
    opts = opts || {};
    const width = opts.width || 640, height = opts.height || 280;
    const ml = 46, mr = 16, mt = 14, mb = 34;
    const plotW = width - ml - mr, plotH = height - mt - mb;
    const allX = series.flatMap(s => s.data.map(d => d.x));
    const allY = series.flatMap(s => s.data.map(d => d.y));
    let [yMin, yMax] = niceRange(Math.min(...allY, opts.comfortBand ? opts.comfortBand.min : Infinity),
                                  Math.max(...allY, opts.comfortBand ? opts.comfortBand.max : -Infinity));
    const xMin = Math.min(...allX), xMax = Math.max(...allX);
    const sx = x => ml + (xMax > xMin ? (x - xMin) / (xMax - xMin) : 0) * plotW;
    const sy = y => mt + plotH - ((y - yMin) / (yMax - yMin)) * plotH;

    const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, class: "chart-svg" });

    if (opts.comfortBand) {
      const y1 = sy(opts.comfortBand.max), y2 = sy(opts.comfortBand.min);
      svg.appendChild(el("rect", { x: ml, y: y1, width: plotW, height: Math.max(0, y2 - y1), class: "chart-comfort-band" }));
    }

    const ticks = 5;
    for (let i = 0; i <= ticks; i++) {
      const yv = yMin + (i / ticks) * (yMax - yMin);
      const y = sy(yv);
      svg.appendChild(el("line", { x1: ml, y1: y, x2: width - mr, y2: y, class: "chart-grid" }));
      svg.appendChild(textEl(ml - 8, y + 4, Math.round(yv * 10) / 10, "chart-tick", "end"));
    }
    const xTickCount = Math.min(8, opts.xTicks || 8);
    for (let i = 0; i <= xTickCount; i++) {
      const xv = xMin + (i / xTickCount) * (xMax - xMin);
      const x = sx(xv);
      svg.appendChild(textEl(x, height - mb + 16, opts.xFormat ? opts.xFormat(xv) : Math.round(xv), "chart-tick", "middle"));
    }
    svg.appendChild(el("line", { x1: ml, y1: mt + plotH, x2: width - mr, y2: mt + plotH, class: "chart-axis" }));
    svg.appendChild(el("line", { x1: ml, y1: mt, x2: ml, y2: mt + plotH, class: "chart-axis" }));

    series.forEach(s => {
      const pts = s.data.map(d => `${sx(d.x)},${sy(d.y)}`).join(" ");
      svg.appendChild(el("polyline", { points: pts, class: "chart-line", style: `stroke:${s.color}` }));
    });

    if (opts.yLabel) {
      const lbl = textEl(14, mt + plotH / 2, opts.yLabel, "chart-axis-label", "middle");
      lbl.setAttribute("transform", `rotate(-90 14 ${mt + plotH / 2})`);
      svg.appendChild(lbl);
    }
    if (opts.xLabel) svg.appendChild(textEl(ml + plotW / 2, height - 4, opts.xLabel, "chart-axis-label", "middle"));

    container.innerHTML = "";
    container.appendChild(svg);

    if (series.length > 1 || opts.legend) {
      const legend = document.createElement("div");
      legend.className = "chart-legend";
      series.forEach(s => {
        const item = document.createElement("span");
        item.className = "chart-legend-item";
        item.innerHTML = `<i style="background:${s.color}"></i>${s.name}`;
        legend.appendChild(item);
      });
      container.appendChild(legend);
    }
  }

  function barChart(container, items, opts) {
    opts = opts || {};
    const width = opts.width || 560, barH = 26, gap = 10;
    const height = items.length * (barH + gap) + 20;
    const ml = opts.labelWidth || 170, mr = 60;
    const plotW = width - ml - mr;
    const maxAbs = Math.max(1, ...items.map(i => Math.abs(i.value)));
    const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, class: "chart-svg" });
    items.forEach((it, i) => {
      const y = 10 + i * (barH + gap);
      svg.appendChild(textEl(ml - 10, y + barH / 2 + 4, it.label, "chart-tick", "end"));
      const w = (Math.abs(it.value) / maxAbs) * plotW;
      const x = it.value >= 0 ? ml : ml - w;
      svg.appendChild(el("rect", { x, y, width: Math.max(1, w), height: barH, class: it.value >= 0 ? "chart-bar-pos" : "chart-bar-neg" }));
      svg.appendChild(textEl(ml + (it.value >= 0 ? w + 6 : -w - 6), y + barH / 2 + 4, (it.value >= 0 ? "+" : "") + it.value, "chart-tick", it.value >= 0 ? "start" : "end"));
    });
    container.innerHTML = "";
    container.appendChild(svg);
  }

  function scatterChart(container, points, opts) {
    opts = opts || {};
    const width = opts.width || 420, height = opts.height || 320;
    const ml = 46, mr = 16, mt = 14, mb = 34;
    const plotW = width - ml - mr, plotH = height - mt - mb;
    const allX = points.map(p => p.x), allY = points.map(p => p.y);
    const lo = Math.min(...allX, ...allY), hi = Math.max(...allX, ...allY);
    const [mn, mx] = niceRange(lo, hi);
    const s = v => ({ x: ml + ((v - mn) / (mx - mn)) * plotW, y: mt + plotH - ((v - mn) / (mx - mn)) * plotH });
    const svg = el("svg", { viewBox: `0 0 ${width} ${height}`, class: "chart-svg" });
    svg.appendChild(el("line", { x1: ml, y1: mt + plotH, x2: width - mr, y2: mt + plotH, class: "chart-axis" }));
    svg.appendChild(el("line", { x1: ml, y1: mt, x2: ml, y2: mt + plotH, class: "chart-axis" }));
    const p1 = s(mn), p2 = s(mx);
    svg.appendChild(el("line", { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, class: "chart-ideal-line" }));
    points.forEach(p => {
      const c = s(p.x);
      svg.appendChild(el("circle", { cx: c.x, cy: mt + plotH - (c.y - mt), r: 4, class: "chart-point" }));
    });
    container.innerHTML = "";
    svg.querySelectorAll("circle").forEach((c, idx) => {
      const p = points[idx];
      const px = ml + ((p.x - mn) / (mx - mn)) * plotW;
      const py = mt + plotH - ((p.y - mn) / (mx - mn)) * plotH;
      c.setAttribute("cx", px); c.setAttribute("cy", py);
    });
    svg.appendChild(textEl(ml + plotW / 2, height - 4, opts.xLabel || "Measured (°C)", "chart-axis-label", "middle"));
    const lbl = textEl(14, mt + plotH / 2, opts.yLabel || "Predicted (°C)", "chart-axis-label", "middle");
    lbl.setAttribute("transform", `rotate(-90 14 ${mt + plotH / 2})`);
    svg.appendChild(lbl);
    container.appendChild(svg);
  }

  function scoreGauge(container, score, sublabel) {
    const size = 140, stroke = 12, r = (size - stroke) / 2, c = size / 2;
    const circumference = 2 * Math.PI * r;
    const offset = circumference * (1 - Math.max(0, Math.min(100, score)) / 100);
    const color = score >= 80 ? "var(--good)" : score >= 60 ? "var(--warn)" : "var(--bad)";
    container.innerHTML = `
      <svg viewBox="0 0 ${size} ${size}" class="gauge-svg">
        <circle cx="${c}" cy="${c}" r="${r}" class="gauge-track" stroke-width="${stroke}" fill="none"/>
        <circle cx="${c}" cy="${c}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
          stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round"
          transform="rotate(-90 ${c} ${c})"/>
        <text x="${c}" y="${c - 4}" text-anchor="middle" class="gauge-score">${Math.round(score)}</text>
        <text x="${c}" y="${c + 18}" text-anchor="middle" class="gauge-max">/100</text>
      </svg>
      ${sublabel ? `<div class="gauge-sublabel">${sublabel}</div>` : ""}`;
  }

  function heatFlowDiagram(container, daily) {
    const rows = [
      { label: "SOLAR INPUT", value: daily.solarKwh, positive: true },
      { label: "INTERNAL GAINS", value: daily.internalKwh, positive: true },
      { label: "WALL LOSS", value: -daily.wallLossKwh, positive: false },
      { label: "ROOF LOSS", value: -daily.roofLossKwh, positive: false },
      { label: "FLOOR LOSS", value: -daily.floorLossKwh, positive: false },
      { label: "OPENING LOSS", value: -daily.openingLossKwh, positive: false },
      { label: "VENTILATION LOSS", value: -daily.ventLossKwh, positive: false },
      { label: "THERMAL MASS EXCHANGE", value: -daily.massExchangeKwh, positive: daily.massExchangeKwh <= 0 },
      { label: "NET ENERGY", value: daily.netKwh, positive: daily.netKwh >= 0, isNet: true }
    ];
    const maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.value)));
    container.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "heatflow";
    rows.forEach((r, i) => {
      const row = document.createElement("div");
      row.className = "heatflow-row" + (r.isNet ? " heatflow-net" : "");
      const barWidth = Math.min(100, (Math.abs(r.value) / maxAbs) * 100);
      row.innerHTML = `
        <div class="heatflow-label">${r.label}</div>
        <div class="heatflow-bar-track">
          <div class="heatflow-bar ${r.value >= 0 ? "pos" : "neg"}" style="width:${barWidth}%"></div>
        </div>
        <div class="heatflow-value ${r.value >= 0 ? "pos" : "neg"}">${r.value >= 0 ? "+" : ""}${r.value.toFixed(1)} kWh/day</div>`;
      wrap.appendChild(row);
      if (i < rows.length - 1) {
        const arrow = document.createElement("div");
        arrow.className = "heatflow-arrow";
        arrow.textContent = "↓";
        wrap.appendChild(arrow);
      }
    });
    container.appendChild(wrap);
  }

  return { lineChart, barChart, scatterChart, scoreGauge, heatFlowDiagram };
})();
</script>

<script>
/* AreaTherm — app state ("database") + localStorage persistence. */
window.APP_STORE = (function () {
  const DATA = window.APP_DATA;
  const KEY = "areatherm_state_v1";

  function defaultDesign() {
    return {
      name: "Baseline Shelter",
      shape: "RECTANGULAR",
      length: 6, width: 4, height: 3,
      orientation: "EAST", azimuthDeg: 90,
      wall: { materialId: "wall_stone", thicknessMm: 400, insulationMaterialId: "ins_puf", insulationThicknessMm: 50 },
      roof: { materialId: "roof_rcc", thicknessMm: 150, insulationMaterialId: "ins_puf", insulationThicknessMm: 50 },
      floor: { materialId: "wall_concrete", thicknessMm: 100 },
      windows: [{ areaEach: 2.4, count: 1, orientation: "FRONT", glazingMaterialId: "glaze_double" }],
      doors: [{ areaEach: 1.8, count: 1 }],
      airLeakageAch: 0.8,
      thermalMass: { materialId: "mass_stone", massKg: 800, surfaceAreaM2: 6 },
      occupancy: 2,
      internalHeatGainW: 150,
      groundTempC: null,
      comfort: { profileId: "human", min: 18, max: 27 }
    };
  }

  function freshState() {
    return {
      project: { name: "Untitled Project", createdAt: new Date().toISOString() },
      locationKey: null,
      location: null,
      seasonKey: "Winter",
      climateSource: null,
      design: defaultDesign(),
      simConfig: { timeStepMinutes: 60, periodType: "24H", days: 1 },
      weights: { ...window.APP_CONFIG.DEFAULT_WEIGHTS },
      mode: "SIMPLE",
      simulationHistory: [],
      lastSimulationResult: null,
      lastOptimizationResult: null,
      validationDatasets: []
    };
  }

  let state = load() || freshState();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  function get() { return state; }
  function reset() { state = freshState(); save(); return state; }

  function loadLadakhDemo(locationKey, seasonKey) {
    const loc = DATA.LOCATIONS[locationKey];
    if (!loc) return;
    state.locationKey = locationKey;
    state.location = loc;
    state.seasonKey = seasonKey || "Winter";
    state.climateSource = { type: "DEMO_ILLUSTRATIVE", label: "Demo / illustrative climate dataset" };
    state.project.name = `${loc.label} — Passive Agricultural Shelter`;
    save();
  }

  function currentSeason() {
    if (!state.location) return null;
    return state.location.seasons[state.seasonKey];
  }

  function updateDesign(patch) {
    state.design = { ...state.design, ...patch };
    save();
  }

  function recordSimulation(result) {
    state.lastSimulationResult = result;
    state.simulationHistory.unshift({
      id: "SIM-" + Date.now(),
      ts: new Date().toISOString(),
      locationLabel: state.location ? state.location.label : "Custom location",
      designName: state.design.name,
      thermalComfortScore: result.scores.thermalComfortScore
    });
    state.simulationHistory = state.simulationHistory.slice(0, 20);
    save();
  }

  function recordOptimization(result) {
    state.lastOptimizationResult = result;
    save();
  }

  function addValidationDataset(ds) {
    state.validationDatasets.unshift(ds);
    save();
  }

  return {
    get, save, reset, loadLadakhDemo, currentSeason, updateDesign,
    recordSimulation, recordOptimization, addValidationDataset, defaultDesign
  };
})();
</script>

  const BEARING = { SOUTH: 180, SE: 135, EAST: 90, NE: 45, NORTH: 0, NW: 315, WEST: 270, SW: 225 };
  function bearingOf(design) {
    if (design.orientation === "CUSTOM") return (180 + (design.azimuthDeg || 0)) % 360;
    return BEARING[design.orientation] ?? 180;
  }

  function drawShelterPreview(container, design, geom) {
    const size = 260, cx = size / 2, cy = size / 2;
    const scale = Math.min(180 / Math.max(geom.L, geom.W || geom.L), 6);
    const w = geom.W ? geom.L * scale : geom.L * scale;
    const h = geom.W ? geom.W * scale : geom.L * scale;
    const bearing = bearingOf(design);
    const isRound = ["CIRCULAR", "DOME", "SEMI_CIRCULAR"].includes(design.shape);
    let shapeSvg;
    if (isRound) {
      shapeSvg = `<circle cx="${cx}" cy="${cy}" r="${w / 2}" fill="#dfeef2" stroke="#1f8a9e" stroke-width="2"/>`;
    } else {
      shapeSvg = `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" fill="#dfeef2" stroke="#1f8a9e" stroke-width="2"/>`;
    }
    const winMark = `<rect x="${cx - w * 0.18}" y="${cy - h / 2 - 4}" width="${w * 0.36}" height="8" fill="#2fb8cf"/>`;
    container.innerHTML = `
      <svg viewBox="0 0 ${size} ${size}" style="width:260px;height:260px;">
        <g transform="rotate(${bearing} ${cx} ${cy})">
          ${shapeSvg}
          ${winMark}
        </g>
        <text x="${cx}" y="14" text-anchor="middle" class="chart-tick" font-size="11">N ↑</text>
        <text x="${cx}" y="${size - 6}" text-anchor="middle" class="chart-tick" font-size="10">Top-down schematic — illustrative</text>
      </svg>`;
  }
