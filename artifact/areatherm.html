          <th>Absorptivity</th><th>${isMass ? "Cost (₹/kg)" : "Cost (₹/m²)"}</th><th>Sustainability</th>
        </tr></thead><tbody>
        ${rows.map(m => `<tr>
          <td>${U.esc(m.name)}</td>
          ${isWindow ? `<td class="num">${m.uValue}</td><td class="num">${m.shgc}</td>` : `<td class="num">${m.density||"—"}</td><td class="num">${m.k||"—"}</td><td class="num">${m.cp||"—"}</td>`}
          <td class="num">${m.absorptivity ?? "—"}</td>
          <td class="num">${isMass ? (m.costPerKg??"—") : (m.costPerM2??"—")}</td>
          <td>${m.sustainability}</td>
        </tr>`).join("")}
        </tbody></table></div>`;
    };

    root.innerHTML = `
      <h1>Material Database</h1>
      <p class="subtitle"><span class="tag tag-demo">Engineering database value</span> — typical/handbook reference
      properties. Verify for actual construction/material specification before field use. Values are configurable.</p>
      ${cats.map(c => `<div class="card" style="margin-bottom:16px;"><h3>${c.replace("_"," ")}</h3>${tableFor(c)}</div>`).join("")}

      <div class="card">
        <h3>Add Custom Material</h3>
        <div class="form-inline">
          <div class="form-row"><label>Category</label><select id="cmCat">${cats.map(c=>`<option value="${c}">${c}</option>`).join("")}</select></div>
          <div class="form-row"><label>Name</label><input id="cmName" placeholder="e.g. Local yak-wool felt"></div>
          <div class="form-row"><label>Density (kg/m³)</label><input id="cmDensity" type="number"></div>
          <div class="form-row"><label>k (W/mK)</label><input id="cmK" type="number" step="0.001"></div>
          <div class="form-row"><label>Cp (J/kgK)</label><input id="cmCp" type="number"></div>
        </div>
        <button class="btn btn-accent btn-sm" id="addMaterialBtn">Add material</button>
        <span class="hint">Custom materials are marked <b>user-provided</b>, not pre-validated engineering values.</span>
      </div>`;

    U.on("#addMaterialBtn", "click", () => {
      const cat = U.qs("#cmCat", root).value, name = U.qs("#cmName", root).value.trim();
      if (!name) { alert("Enter a material name."); return; }
      DATA.MATERIALS.push({
        id: "custom_" + Date.now(), category: cat, name,
        density: parseFloat(U.qs("#cmDensity", root).value) || null,
        k: parseFloat(U.qs("#cmK", root).value) || null,
        cp: parseFloat(U.qs("#cmCp", root).value) || null,
        absorptivity: 0.6, reflectivity: 0.4, emissivity: 0.9,
        costPerM2: 1000, costPerKg: 5, sustainability: "MEDIUM", isCustom: true
      });
      window.APP.render();
      window.APP.toast("Custom material added (user-provided — not a validated engineering value).");
    }, root);
  };
})();
</script>

<script>
/* AreaTherm UI — Thermal Simulation, Optimization, What-If Analysis */
window.UI = window.UI || {};

(function () {
  const DATA = window.APP_DATA, ENGINE = window.APP_ENGINE, STORE = window.APP_STORE, CH = window.APP_CHARTS;

  function matName(id) { const m = DATA.materialById(id); return m ? m.name : id || "—"; }

  function noClimateCard() {
    return `<div class="card"><p class="subtitle">No climate profile loaded yet. Go to <a href="#/location" style="color:var(--accent);font-weight:600;">Location &amp; Climate</a> and load a location first.</p></div>`;
  }

  function explainWall(result, design, season) {
    const geom = result.geometry, u = result.uValues.wall;
    const coldest = result.series.reduce((a, b) => a.tAmb < b.tAmb ? a : b);
    const face = geom.faces[0];
    return `
      <p><b>Formula</b> (per face, sol-air adjusted):</p>
      <pre>Q_wall = U_wall × A_wall × (T_indoor − T_sol-air)
T_sol-air = T_amb + (α × G_face) / h_o</pre>
      <p><b>Representative hour</b> — coldest ambient timestep in this run (hour ${coldest.hourDecimal.toFixed(1)}):</p>
      <pre>U_wall        = ${u.toFixed(3)} W/m²K   (from wall + insulation layers, see Materials)
Total wall area = ${geom.wallArea.toFixed(1)} m²
T_amb         = ${coldest.tAmb} °C
T_indoor      = ${coldest.tIndoor} °C
G (horizontal)= ${coldest.gHoriz} W/m²
α (wall)      = ${(DATA.materialById(design.wall.materialId)||{}).absorptivity ?? 0.6}
h_o           = 23 W/m²K

T_sol-air (front face, factor ${face.factor.toFixed(2)}) = ${coldest.tAmb} + (${(DATA.materialById(design.wall.materialId)||{}).absorptivity ?? 0.6} × ${(coldest.gHoriz*face.factor).toFixed(1)}) / 23
            ≈ ${(coldest.tAmb + ((DATA.materialById(design.wall.materialId)||{}).absorptivity ?? 0.6) * coldest.gHoriz*face.factor / 23).toFixed(2)} °C

Q_wall (all faces, this hour) = ${coldest.qWall} W</pre>
      <p class="hint">Positive Q = heat leaving the shelter through the walls at this timestep.</p>`;
  }
  function explainRoof(result, design) {
    const geom = result.geometry, u = result.uValues.roof;
    const coldest = result.series.reduce((a, b) => a.tAmb < b.tAmb ? a : b);
    return `<pre>Q_roof = U_roof × A_roof × (T_indoor − T_sol-air,roof)

U_roof = ${u.toFixed(3)} W/m²K
A_roof = ${geom.roofArea.toFixed(1)} m²
T_indoor = ${coldest.tIndoor} °C,  T_amb = ${coldest.tAmb} °C,  G = ${coldest.gHoriz} W/m²

Q_roof (this hour) = ${coldest.qRoof} W</pre>`;
  }
  function explainFloor(result, design) {
    const geom = result.geometry, u = result.uValues.floor;
    const coldest = result.series.reduce((a, b) => a.tAmb < b.tAmb ? a : b);
    return `<pre>Q_floor = U_floor × A_floor × (T_indoor − T_ground)

U_floor = ${u.toFixed(3)} W/m²K  (assumption: ground contact resistance 0.5 m²K/W + floor layer)
A_floor = ${geom.floorArea.toFixed(1)} m²
T_indoor = ${coldest.tIndoor} °C

Q_floor (this hour) = ${coldest.qFloor} W</pre>`;
  }
  function explainSolar(result, design) {
    const peakSun = result.series.reduce((a, b) => a.gHoriz > b.gHoriz ? a : b);
    const w = design.windows[0];
    const shgc = (DATA.materialById(w.glazingMaterialId) || {}).shgc || 0.7;
    return `<pre>Q_solar,window = A_window × G × orientation_factor × SHGC

A_window (total) = ${result.windowArea.toFixed(2)} m²
G (peak-sun hour, ${peakSun.hourDecimal.toFixed(1)}h) = ${peakSun.gHoriz} W/m²
orientation_factor (front face) = ${result.geometry.faces[0].factor.toFixed(2)}
SHGC (${matNameLocal(w.glazingMaterialId)}) = ${shgc}

Q_solar,window ≈ ${result.windowArea.toFixed(2)} × ${peakSun.gHoriz} × ${result.geometry.faces[0].factor.toFixed(2)} × ${shgc}
            = ${peakSun.qSolarWindow} W  (at this hour)

Daily total (integrated over all daylight hours) = ${result.daily.solarKwh} kWh/day</pre>
      <p class="hint">Opaque-surface solar gain (through walls/roof) is folded into the sol-air conduction terms — see Explain Calculation on Wall/Roof Loss.</p>`;
  }
  function matNameLocal(id) { const m = DATA.materialById(id); return m ? m.name : id; }

  function explainOpening(result, design) {
    const coldest = result.series.reduce((a, b) => a.tAmb < b.tAmb ? a : b);
    const peakSun = result.series.reduce((a, b) => a.gHoriz > b.gHoriz ? a : b);
    const w = design.windows[0];
    return `<pre>Conduction:  Q_window,cond = U_window × A_window × (T_indoor − T_amb)
Solar gain:  Q_solar,window = A_window × G × orientation_factor × SHGC

U_window = ${ENGINE.windowUValue(w).toFixed(2)} W/m²K,  SHGC = ${(DATA.materialById(w.glazingMaterialId)||{}).shgc}
A_window (total) = ${result.windowArea.toFixed(2)} m²

At coldest hour: T_indoor=${coldest.tIndoor}°C, T_amb=${coldest.tAmb}°C → Q_window,cond ≈ ${coldest.qWindowCond} W
At peak-sun hour (${peakSun.hourDecimal.toFixed(1)}h): G=${peakSun.gHoriz} W/m² → Q_solar,window ≈ ${peakSun.qSolarWindow} W</pre>`;
  }
  function explainVent(result, design) {
    const coldest = result.series.reduce((a, b) => a.tAmb < b.tAmb ? a : b);
    return `<pre>Q_vent = ACH × Volume / 3600 × ρ_air × Cp_air × (T_indoor − T_amb)

ACH (wind-adjusted) ≈ ${design.airLeakageAch}
Volume = ${result.geometry.volume.toFixed(1)} m³
ρ_air = 1.2 kg/m³,  Cp_air = 1005 J/kgK
T_indoor=${coldest.tIndoor}°C, T_amb=${coldest.tAmb}°C

Q_vent (this hour) = ${coldest.qVent} W</pre>`;
  }
  function explainMass(result, design) {
    if (!design.thermalMass) return `<p>No thermal mass configured in this design.</p>`;
    const peakSun = result.series.reduce((a, b) => a.gHoriz > b.gHoriz ? a : b);
    const mat = DATA.materialById(design.thermalMass.materialId);
    return `<pre>Q_exchange = h_mass × A_mass × (T_indoor − T_mass)
C_mass × dT_mass/dt = Q_exchange + f_solar_to_mass × Q_solar,window

Material: ${mat.name},  mass = ${design.thermalMass.massKg} kg,  Cp = ${mat.cp} J/kgK
h_mass = 8 W/m²K,  A_mass = ${design.thermalMass.surfaceAreaM2} m²

At hour ${peakSun.hourDecimal.toFixed(1)} (peak solar): T_indoor=${peakSun.tIndoor}°C, T_mass=${peakSun.tMass}°C
Q_exchange ≈ ${peakSun.qMassExchange} W  (positive = mass absorbing heat from air)</pre>`;
  }
  function explainScore(result) {
    return `<pre>Thermal Comfort Score = 0.45×ComfortHours% + 0.25×HeatRetention% + 0.20×SolarUtilization% + 0.10×EnergyAdequacy

ComfortHours%   = 0.5×Daytime(${result.comfort.dayComfortPct}%) + 0.5×Night(${result.comfort.nightComfortPct}%) = ${result.scores.comfortScore}%
HeatRetention%  = ${result.scores.heatRetentionPct}%
SolarUtilization% = ${result.scores.solarUtilizationPct}%

Thermal Comfort Score = ${result.scores.thermalComfortScore} / 100</pre>
      <p class="hint">Weights are configurable in Settings / Optimization.</p>`;
  }

  function explainBtn(label) {
    return `<span class="explain-link" data-explain="${label}">Explain calculation →</span>`;
  }

  function wireExplainButtons(root, result, design, season) {
    const map = {
      solar: () => explainSolar(result, design),
      wall: () => explainWall(result, design, season), roof: () => explainRoof(result, design),
      floor: () => explainFloor(result, design), opening: () => explainOpening(result, design),
      vent: () => explainVent(result, design), mass: () => explainMass(result, design),
      score: () => explainScore(result)
    };
    U.qsa("[data-explain]", root).forEach(elm => {
      elm.addEventListener("click", () => window.APP.showExplain(elm.textContent.replace(" →", "") + " — " + elm.dataset.explain, map[elm.dataset.explain]()));
    });
  }

  UI.renderSimulation = function (root) {
    const s = STORE.get();
    const season = STORE.currentSeason();
    if (!season) { root.innerHTML = `<h1>Thermal Simulation</h1>` + noClimateCard(); return; }

    const result = s.lastSimulationResult;
    root.innerHTML = `
      <h1>Thermal Simulation</h1>
      <p class="subtitle">Hourly physics-based energy balance for <b>${U.esc(s.location.label)}</b> — ${U.esc(s.seasonKey)} <span class="tag tag-demo">demo climate</span></p>
      <div class="card">
        <div class="form-inline">
          <div class="form-row"><label>Time step</label>
            <select id="simStep">${[15,30,60].map(v=>`<option value="${v}" ${s.simConfig.timeStepMinutes===v?"selected":""}>${v} min</option>`).join("")}</select>
          </div>
          <div class="form-row"><label>Period</label>
            <select id="simPeriod">
              <option value="24H" ${s.simConfig.periodType==="24H"?"selected":""}>24 hours</option>
              <option value="7D" ${s.simConfig.periodType==="7D"?"selected":""}>7 days</option>
              <option value="30D" ${s.simConfig.periodType==="30D"?"selected":""}>30 days</option>
            </select>
          </div>
          <div class="form-row" style="align-self:flex-end;"><button class="btn btn-accent" id="runSimBtn">▶ Run Thermal Simulation</button></div>
        </div>
      </div>

      ${result ? `
      <div class="grid grid-4" style="margin:16px 0;">
        <div class="metric-card card"><div class="metric-label">Predicted Indoor Temp</div><div class="metric-value" style="font-size:18px;">${result.comfort.minIndoor} – ${result.comfort.maxIndoor} °C</div><div class="metric-sub">Model Prediction</div></div>
        <div class="metric-card card"><div class="metric-label">Solar Heat Gain</div><div class="metric-value" style="font-size:18px;">${result.daily.solarKwh} kWh/day</div></div>
        <div class="metric-card card"><div class="metric-label">Total Heat Loss</div><div class="metric-value" style="font-size:18px;">${result.daily.totalLossKwh} kWh/day</div></div>
        <div class="metric-card card"><div class="metric-label">Comfort Duration</div><div class="metric-value" style="font-size:18px;">${result.comfort.comfortHoursPerDay} h/day</div></div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <h3>Indoor vs Ambient Temperature vs Comfort Range</h3>
        <div id="tempChart"></div>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <h3>Heat Flow Analysis (daily totals)</h3>
          <div id="heatFlowDiv"></div>
        </div>
        <div class="card">
          <h3>Heat Balance Detail <span class="tag tag-model">model prediction</span></h3>
          <table>
            <tr><td>Solar thermal energy received</td><td class="num">${result.daily.solarKwh} kWh/day</td><td>${explainBtn("solar")}</td></tr>
            <tr><td>Heat loss — walls</td><td class="num">${result.daily.wallLossKwh} kWh/day</td><td>${explainBtn("wall")}</td></tr>
            <tr><td>Heat loss — roof</td><td class="num">${result.daily.roofLossKwh} kWh/day</td><td>${explainBtn("roof")}</td></tr>
            <tr><td>Heat loss — floor</td><td class="num">${result.daily.floorLossKwh} kWh/day</td><td>${explainBtn("floor")}</td></tr>
            <tr><td>Heat loss — openings</td><td class="num">${result.daily.openingLossKwh} kWh/day</td><td>${explainBtn("opening")}</td></tr>
            <tr><td>Ventilation / infiltration loss</td><td class="num">${result.daily.ventLossKwh} kWh/day</td><td>${explainBtn("vent")}</td></tr>
            <tr><td>Thermal mass exchange</td><td class="num">${result.daily.massExchangeKwh} kWh/day</td><td>${explainBtn("mass")}</td></tr>
            <tr><td>Heating requirement</td><td class="num">${result.daily.heatingReqKwh} kWh/day</td><td></td></tr>
            <tr><td>Cooling requirement</td><td class="num">${result.daily.coolingReqKwh} kWh/day</td><td></td></tr>
            <tr style="font-weight:700;"><td>Net energy balance</td><td class="num">${result.daily.netKwh} kWh/day</td><td></td></tr>
          </table>
        </div>
      </div>

      <div class="card" style="margin-top:16px;">
        <h3>Thermal Comfort Score ${explainBtn("score")}</h3>
        <div style="display:flex; align-items:center; gap:22px;">
          <div id="simGauge"></div>
          <ul class="checklist">
            <li>Daytime comfort: <b>${result.comfort.dayComfortPct}%</b></li>
            <li>Night comfort: <b>${result.comfort.nightComfortPct}%</b></li>
            <li>Solar utilization: <b>${result.scores.solarUtilizationPct}%</b></li>
            <li>Heat retention: <b>${result.scores.heatRetentionPct}%</b></li>
          </ul>
        </div>
      </div>
      ` : `<div class="card"><p class="subtitle">Run the simulation to see predicted indoor temperature, solar gain, heat losses, and comfort duration.</p></div>`}
    `;

    if (result) {
      const dt = s.simConfig.timeStepMinutes / 60;
      CH.lineChart(U.qs("#tempChart", root), [
        { name: "Indoor Temp", color: "#1f8a9e", data: result.series.map(pt => ({ x: pt.stepIndex * dt, y: pt.tIndoor })) },
        { name: "Ambient Temp", color: "#c93b3b", data: result.series.map(pt => ({ x: pt.stepIndex * dt, y: pt.tAmb })) }
      ], { height: 260, yLabel: "°C", xLabel: "Hours from simulation start", comfortBand: { min: s.design.comfort.min, max: s.design.comfort.max } });
      CH.heatFlowDiagram(U.qs("#heatFlowDiv", root), result.daily);
      CH.scoreGauge(U.qs("#simGauge", root), result.scores.thermalComfortScore);
      wireExplainButtons(root, result, s.design, season);
    }

    U.on("#runSimBtn", "click", () => {
      const timeStepMinutes = parseInt(U.qs("#simStep", root).value);
      const periodType = U.qs("#simPeriod", root).value;
      const days = periodType === "24H" ? 1 : periodType === "7D" ? 7 : 30;
      STORE.get().simConfig = { timeStepMinutes, periodType, days };
      const res = ENGINE.runSimulation(STORE.get().design, season, STORE.get().simConfig);
      STORE.recordSimulation(res);
      window.APP.render();
      window.APP.toast("Simulation complete.");
    }, root);
  };

  UI.renderOptimization = function (root) {
    const s = STORE.get();
    const season = STORE.currentSeason();
    if (!season) { root.innerHTML = `<h1>Design Optimization</h1>` + noClimateCard(); return; }
    const w = s.weights;
    const opt = s.lastOptimizationResult;

    const weightRow = (key, label) => `
      <div class="form-row"><label>${label} (${Math.round(w[key]*100)}%)</label>
        <input type="range" min="0" max="100" value="${Math.round(w[key]*100)}" data-weight="${key}"></div>`;

    root.innerHTML = `
      <h1>Design Optimization Engine</h1>
      <p class="subtitle">Generates candidate shelter configurations across orientation, insulation, glazing, window
      area, and thermal mass — scores each with a configurable weighted multi-criteria formula.</p>

      <div class="card">
        <h3>Scoring Weights (must total 100%)</h3>
        <div class="grid grid-3">
          ${weightRow("comfort", "Thermal Comfort")}
          ${weightRow("retention", "Heat Retention")}
          ${weightRow("solar", "Solar Utilization")}
          ${weightRow("energy", "Energy Efficiency")}
          ${weightRow("cost", "Cost")}
        </div>
        <div id="weightTotal" class="hint"></div>
        <button class="btn btn-accent" id="runOptBtn" style="margin-top:10px;">▶ Run Design Optimization</button>
      </div>

      ${opt ? `
      <div class="card" style="margin:16px 0;">
        <h3>Candidate Designs <span class="tag tag-model">${opt.candidatesEvaluated} configurations evaluated</span></h3>
        <div class="table-wrap"><table><thead><tr>
          <th>Design</th><th>Orientation</th><th>Insulation</th><th>Window %</th><th>Glazing</th><th>Thermal Mass</th>
          <th>Comfort</th><th>Retention</th><th>Solar</th><th>Energy</th><th>Cost</th><th>Total Score</th>
        </tr></thead><tbody>
          ${opt.top.map(c => `<tr class="${c.isRecommended ? "highlight-recommended" : ""}">
            <td><b>${c.label}</b>${c.isRecommended ? " ★" : ""}</td>
            <td>${c.params.orient}</td><td>${c.params.insul} mm</td><td>${Math.round(c.params.wpct*100)}%</td>
            <td>${matName(c.params.glz)}</td><td>${c.params.mass} kg</td>
            <td class="num">${c.score.comfort.toFixed(0)}</td><td class="num">${c.score.retention.toFixed(0)}</td>
            <td class="num">${c.score.solar.toFixed(0)}</td><td class="num">${c.score.energyScore.toFixed(0)}</td>
            <td class="num">${c.score.costScore.toFixed(0)}</td><td class="num"><b>${c.score.total.toFixed(1)}</b></td>
          </tr>`).join("")}
        </tbody></table></div>
      </div>

      <div class="recommend-panel" style="margin-bottom:16px;">
        <h2 style="margin-bottom:0;">✅ Recommended Shelter Design — Design ${opt.recommended.label} <span class="tag tag-model">Model Prediction</span></h2>
        <div class="recommend-grid">
          <div class="recommend-item"><div class="k">Orientation</div><div class="v">${opt.recommended.params.orient}-facing</div></div>
          <div class="recommend-item"><div class="k">Dimensions</div><div class="v">${opt.recommended.design.length}m × ${opt.recommended.design.width}m × ${opt.recommended.design.height}m</div></div>
          <div class="recommend-item"><div class="k">Wall</div><div class="v">${matName(opt.recommended.design.wall.materialId)}</div></div>
          <div class="recommend-item"><div class="k">Insulation</div><div class="v">${opt.recommended.params.insul} mm</div></div>
          <div class="recommend-item"><div class="k">Roof</div><div class="v">${matName(opt.recommended.design.roof.materialId)}</div></div>
          <div class="recommend-item"><div class="k">Windows</div><div class="v">${matName(opt.recommended.params.glz)}, ${Math.round(opt.recommended.params.wpct*100)}% of wall area</div></div>
          <div class="recommend-item"><div class="k">Thermal mass</div><div class="v">${opt.recommended.params.mass > 0 ? matName(opt.recommended.design.thermalMass.materialId) + " (" + opt.recommended.params.mass + " kg)" : "None"}</div></div>
          <div class="recommend-item"><div class="k">Comfort duration</div><div class="v">${opt.recommended.result.comfort.comfortHoursPerDay} h/day</div></div>
          <div class="recommend-item"><div class="k">Predicted temp range</div><div class="v">${opt.recommended.result.comfort.minIndoor}–${opt.recommended.result.comfort.maxIndoor} °C</div></div>
          <div class="recommend-item"><div class="k">Solar utilization</div><div class="v">${opt.recommended.result.scores.solarUtilizationPct}%</div></div>
          <div class="recommend-item"><div class="k">Heat loss</div><div class="v">${opt.recommended.result.daily.totalLossKwh} kWh/day</div></div>
          <div class="recommend-item"><div class="k">Thermal performance score</div><div class="v">${opt.recommended.score.total.toFixed(0)}/100</div></div>
        </div>
        <p class="hint" style="margin-top:10px;">Estimated cost: ₹${opt.recommended.cost.toLocaleString("en-IN")} (materials-based estimate, model prediction — verify with local quotations).</p>
        <button class="btn btn-accent btn-sm" id="adoptRecommendedBtn" style="margin-top:6px;">Adopt as current shelter design</button>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <h3>Design Comparison</h3>
        <div class="table-wrap"><table><thead><tr><th>Parameter</th>${opt.top.map(c=>`<th>Design ${c.label}${c.isRecommended?" (Recommended)":""}</th>`).join("")}</tr></thead>
        <tbody>
          ${[
            ["Floor area (m²)", c=>c.result.geometry.floorArea.toFixed(1)],
            ["Volume (m³)", c=>c.result.geometry.volume.toFixed(1)],
            ["Wall material", c=>matName(c.design.wall.materialId)],
            ["Roof material", c=>matName(c.design.roof.materialId)],
            ["Insulation (mm)", c=>c.params.insul],
            ["Window area (%)", c=>Math.round(c.params.wpct*100)+"%"],
            ["Orientation", c=>c.params.orient],
            ["Solar gain (kWh/day)", c=>c.result.daily.solarKwh],
            ["Heat loss (kWh/day)", c=>c.result.daily.totalLossKwh],
            ["Min indoor temp (°C)", c=>c.result.comfort.minIndoor],
            ["Max indoor temp (°C)", c=>c.result.comfort.maxIndoor],
            ["Comfort hours/day", c=>c.result.comfort.comfortHoursPerDay],
            ["Energy requirement (kWh/day)", c=>(c.result.daily.heatingReqKwh+c.result.daily.coolingReqKwh).toFixed(2)],
            ["Thermal score", c=>c.score.total.toFixed(1)],
            ["Estimated cost (₹)", c=>c.cost.toLocaleString("en-IN")]
          ].map(([label, fn]) => `<tr><td>${label}</td>${opt.top.map(c=>`<td class="num ${c.isRecommended?"highlight-recommended":""}">${fn(c)}</td>`).join("")}</tr>`).join("")}
        </tbody></table></div>
      </div>

      <div class="card">
        <h3>Sensitivity Analysis <span class="tag tag-model">from current baseline design</span></h3>
        <p class="hint">Impact on thermal score (Δ points) when each parameter is improved from the current baseline design.</p>
        <div id="sensChart"></div>
      </div>
      ` : `<div class="card" style="margin-top:16px;"><p class="subtitle">Run optimization to generate and compare candidate designs.</p></div>`}
    `;

    function refreshWeightTotal() {
      const total = ["comfort","retention","solar","energy","cost"].reduce((a,k)=>a+w[k]*100,0);
      U.qs("#weightTotal", root).textContent = `Current total: ${Math.round(total)}%` + (Math.round(total) !== 100 ? "  (will be normalized on run)" : "");
    }
    refreshWeightTotal();
    U.qsa("[data-weight]", root).forEach(inp => inp.addEventListener("input", () => {
      w[inp.dataset.weight] = parseInt(inp.value) / 100;
      refreshWeightTotal();
    }));

    if (opt) {
      const sens = ENGINE.sensitivityAnalysis(s.design, season, s.simConfig, normalizedWeights(w));
      CH.barChart(U.qs("#sensChart", root), sens.impacts.map(i => ({ label: i.parameter, value: i.deltaScore })));
      U.on("#adoptRecommendedBtn", "click", () => {
        STORE.updateDesign(opt.recommended.design);
        window.APP.toast("Recommended design adopted as current shelter design.");
        window.APP.navigate("designer");
      }, root);
    }

    U.on("#runOptBtn", "click", () => {
      const nw = normalizedWeights(w);
      s.weights = nw;
      const result = ENGINE.runOptimization(s.design, season, s.simConfig, nw);
      STORE.recordOptimization(result);
      window.APP.render();
      window.APP.toast(`Optimization complete — ${result.candidatesEvaluated} candidates evaluated.`);
    }, root);
  };

  function normalizedWeights(w) {
    const total = ["comfort","retention","solar","energy","cost"].reduce((a,k)=>a+w[k],0) || 1;
    const out = {};
    ["comfort","retention","solar","energy","cost"].forEach(k => out[k] = w[k] / total);
    return out;
  }

  const WHATIF_PRESETS = {
    insulation: { label: "Increase insulation 50mm → 100mm", apply: d => { d.wall.insulationThicknessMm = 100; d.roof.insulationThicknessMm = 100; } },
    window: { label: "Increase window area 10% → 20% of wall area", apply: d => { const geom = ENGINE.computeGeometry(d); d.windows[0].areaEach = geom.wallArea * 0.20; } },
    orientation: { label: "Change orientation East → South", apply: d => { d.orientation = "SOUTH"; d.azimuthDeg = 0; } },
    mass: { label: "Add thermal mass (800 kg stone)", apply: d => { d.thermalMass = { materialId: "mass_stone", massKg: 800, surfaceAreaM2: 6 }; } },
    roof: { label: "Change roof to insulated composite roof", apply: d => { d.roof.materialId = "roof_composite"; } }
  };

  UI.renderWhatIf = function (root) {
    const s = STORE.get();
    const season = STORE.currentSeason();
    if (!season) { root.innerHTML = `<h1>What-If Analysis</h1>` + noClimateCard(); return; }

    root.innerHTML = `
      <h1>What-If Analysis</h1>
      <p class="subtitle">Compare the current baseline design against a single-parameter change.</p>
      <div class="card">
        <div class="form-row"><label>Scenario</label>
          <select id="whatifPreset">${Object.entries(WHATIF_PRESETS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("")}</select>
        </div>
        <button class="btn btn-accent" id="runWhatifBtn">▶ Run What-If Comparison</button>
      </div>
      <div id="whatifResults"></div>
    `;

    U.on("#runWhatifBtn", "click", () => {
      const key = U.qs("#whatifPreset", root).value;
      const preset = WHATIF_PRESETS[key];
      const before = JSON.parse(JSON.stringify(s.design));
      const after = JSON.parse(JSON.stringify(s.design));
      preset.apply(after);
      const beforeRes = ENGINE.runSimulation(before, season, s.simConfig);
      const afterRes = ENGINE.runSimulation(after, season, s.simConfig);

      const wrap = U.qs("#whatifResults", root);
      wrap.innerHTML = `
        <div class="card" style="margin-top:16px;">
          <h3>${preset.label}</h3>
          <div class="grid grid-4">
            ${[
              ["Comfort hours/day", beforeRes.comfort.comfortHoursPerDay, afterRes.comfort.comfortHoursPerDay, ""],
              ["Total heat loss (kWh/day)", beforeRes.daily.totalLossKwh, afterRes.daily.totalLossKwh, ""],
              ["Solar gain (kWh/day)", beforeRes.daily.solarKwh, afterRes.daily.solarKwh, ""],
              ["Thermal score", beforeRes.scores.thermalComfortScore, afterRes.scores.thermalComfortScore, ""]
            ].map(([label,b,a]) => `<div class="metric-card card">
                <div class="metric-label">${label}</div>
                <div class="metric-value" style="font-size:16px;">${b} → ${a}</div>
                <div class="metric-sub" style="color:${a>=b?'var(--good)':'var(--bad)'}">${a>=b?"+":""}${(a-b).toFixed(2)}</div>
              </div>`).join("")}
          </div>
          <h3 style="margin-top:14px;">Indoor Temperature — Before vs After</h3>
          <div id="whatifChart"></div>
        </div>`;
      const dt = s.simConfig.timeStepMinutes / 60;
      CH.lineChart(U.qs("#whatifChart", wrap), [
        { name: "Before", color: "#8b98a6", data: beforeRes.series.map(pt => ({ x: pt.stepIndex*dt, y: pt.tIndoor })) },
        { name: "After", color: "#1f8a9e", data: afterRes.series.map(pt => ({ x: pt.stepIndex*dt, y: pt.tIndoor })) }
      ], { height: 240, yLabel: "°C", xLabel: "Hours", comfortBand: { min: s.design.comfort.min, max: s.design.comfort.max } });
    }, root);
  };
})();
</script>

<script>
/* AreaTherm UI — Validation, Reports, Evaluator Summary, Settings */
window.UI = window.UI || {};

(function () {
  const DATA = window.APP_DATA, ENGINE = window.APP_ENGINE, STORE = window.APP_STORE, CH = window.APP_CHARTS, CFG = window.APP_CONFIG;
  function matName(id) { const m = DATA.materialById(id); return m ? m.name : id || "—"; }

  function predictSteadyState(design, ambientC, solarWm2) {
    const geom = ENGINE.computeGeometry(design);
    const uWall = ENGINE.wallUValue(design), uRoof = ENGINE.roofUValue(design), uFloor = ENGINE.floorUValue(design);
    const win = design.windows[0];
    const uWin = ENGINE.windowUValue(win);
    const shgc = (DATA.materialById(win.glazingMaterialId) || {}).shgc || 0.7;
    const windowArea = (win.areaEach || 0) * (win.count || 0);
    const ventUA = (design.airLeakageAch * geom.volume / 3600) * 1.2 * 1005;
    const UA = uWall * geom.wallArea + uRoof * geom.roofArea + uFloor * geom.floorArea + uWin * windowArea + ventUA;
    const solarGain = windowArea * solarWm2 * 0.85 * shgc + (design.internalHeatGainW || 0);
    return ambientC + solarGain / UA;
  }

  let validationRows = [
    { hour: 8, ambient: -6, solar: 120, wind: 2, rh: 35, measured: 4 },
    { hour: 12, ambient: 2, solar: 620, wind: 2.4, rh: 30, measured: 13 },
    { hour: 16, ambient: -1, solar: 240, wind: 2.1, rh: 32, measured: 9 },
    { hour: 20, ambient: -9, solar: 0, wind: 1.8, rh: 38, measured: 1 }
  ];

  UI.renderValidation = function (root) {
    const s = STORE.get();

    root.innerHTML = `
      <h1>Model Validation</h1>
      <p class="subtitle"><span class="tag tag-field">user-provided</span> Enter measured field data (from an actual
      instrumented shelter) to compare against the model's prediction. No field measurements exist for this prototype —
      the rows below are editable placeholders you can overwrite. Requires field validation before use in a real
      engineering decision.</p>

      <div class="card">
        <h3>Measured Data Points</h3>
        <div class="table-wrap"><table><thead><tr>
          <th>Hour of day</th><th>Ambient (°C)</th><th>Solar (W/m²)</th><th>Wind (m/s)</th><th>RH (%)</th><th>Measured Indoor (°C)</th><th></th>
        </tr></thead><tbody id="valRows">
          ${validationRows.map((r, i) => `<tr data-i="${i}">
            <td><input type="number" step="0.5" value="${r.hour}" data-f="hour" style="width:70px;"></td>
            <td><input type="number" value="${r.ambient}" data-f="ambient" style="width:70px;"></td>
            <td><input type="number" value="${r.solar}" data-f="solar" style="width:80px;"></td>
            <td><input type="number" step="0.1" value="${r.wind}" data-f="wind" style="width:60px;"></td>
            <td><input type="number" value="${r.rh}" data-f="rh" style="width:60px;"></td>
            <td><input type="number" step="0.1" value="${r.measured}" data-f="measured" style="width:70px;"></td>
            <td><button class="btn btn-sm" data-remove="${i}">✕</button></td>
          </tr>`).join("")}
        </tbody></table></div>
        <button class="btn btn-sm" id="addRowBtn" style="margin-top:8px;">+ Add row</button>
        <button class="btn btn-accent" id="runValidationBtn" style="margin-left:8px;">Compare Measured vs Predicted</button>
        <p class="hint">Predicted values use a steady-state point-balance approximation (Q_solar + Q_internal = UA × ΔT)
        against the current shelter design — a simplification for point-in-time validation, documented as an assumption.
        Full transient validation requires continuous time-aligned field logging (future integration).</p>
      </div>

      <div id="validationResults"></div>
    `;

    function bindRows() {
      U.qsa("#valRows input", root).forEach(inp => inp.addEventListener("change", () => {
        const i = parseInt(inp.closest("tr").dataset.i);
        validationRows[i][inp.dataset.f] = parseFloat(inp.value);
      }));
      U.qsa("[data-remove]", root).forEach(btn => btn.addEventListener("click", () => {
        validationRows.splice(parseInt(btn.dataset.remove), 1);
        window.APP.render();
      }));
    }
    bindRows();

    U.on("#addRowBtn", "click", () => {
      validationRows.push({ hour: 12, ambient: 0, solar: 300, wind: 2, rh: 30, measured: 10 });
      window.APP.render();
    }, root);

    U.on("#runValidationBtn", "click", () => {
      const points = validationRows.map(r => ({
        ...r, predicted: Math.round(predictSteadyState(s.design, r.ambient, r.solar) * 100) / 100
      }));
      const stats = ENGINE.validationStats(points.map(p => ({ measured: p.measured, predicted: p.predicted })));
      STORE.addValidationDataset({ id: "VAL-" + Date.now(), ts: new Date().toISOString(), points, stats });

      const wrap = U.qs("#validationResults", root);
      wrap.innerHTML = `
        <div class="card" style="margin-top:16px;">
          <h3>Error Metrics <span class="tag tag-model">model prediction vs user-provided measurement</span></h3>
          <div class="grid grid-4">
            <div class="metric-card card"><div class="metric-label">MAE</div><div class="metric-value">${stats.mae}</div><div class="metric-sub">°C</div></div>
            <div class="metric-card card"><div class="metric-label">RMSE</div><div class="metric-value">${stats.rmse}</div><div class="metric-sub">°C</div></div>
            <div class="metric-card card"><div class="metric-label">MAPE</div><div class="metric-value">${stats.mape}</div><div class="metric-sub">%</div></div>
            <div class="metric-card card"><div class="metric-label">R²</div><div class="metric-value">${stats.r2 ?? "—"}</div><div class="metric-sub">n = ${stats.n}</div></div>
          </div>
          <h3 style="margin-top:14px;">Measured vs Predicted</h3>
          <div id="valScatter" style="max-width:440px;"></div>
        </div>`;
      CH.scatterChart(U.qs("#valScatter", wrap), points.map(p => ({ x: p.measured, y: p.predicted })), { xLabel: "Measured Indoor (°C)", yLabel: "Predicted Indoor (°C)" });
    }, root);
  };

  UI.renderReport = function (root) {
    const s = STORE.get();
    const result = s.lastSimulationResult;
    const opt = s.lastOptimizationResult;
    const season = STORE.currentSeason();
    const now = new Date();
    const simId = "SIM-" + now.getTime();

    root.innerHTML = `
      <div class="card" style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;">
        <div><b>Engineering Report</b> — printable / exportable to PDF via your browser's print dialog.</div>
        <button class="btn btn-accent" id="printBtn">🖨 Print / Save as PDF</button>
      </div>
      <div class="card" id="reportDoc" style="line-height:1.7;">
        <h1 style="text-align:center;">Area-Specific Passive Shelter Thermal Performance &amp; Design Optimization Report</h1>
        <p style="text-align:center;color:var(--text-muted);">Generated: ${now.toLocaleString()} &nbsp;|&nbsp; Model version: ${CFG.MODEL_VERSION} &nbsp;|&nbsp; Simulation ID: ${simId}</p>
        <hr/>
        <h3>1–2. Project &amp; Location</h3>
        <p>Project: <b>${U.esc(s.project.name)}</b><br/>
        Location: <b>${s.location ? U.esc(s.location.label) : "Not set"}</b>
        ${s.location ? `(Lat ${s.location.latitude}, Lon ${s.location.longitude}, Elevation ${s.location.elevationM} m)` : ""}
        ${s.climateSource ? `<span class="tag tag-demo">${U.esc(s.climateSource.label)}</span>` : ""}</p>

        <h3>3. Climate Inputs (${s.seasonKey || "—"})</h3>
        ${season ? `<p>Ambient temperature: ${season.tMin} to ${season.tMax} °C · Solar irradiance: ${season.solarKwhDay} kWh/m²/day ·
        Sunshine window: ${season.sunrise}h–${season.sunset}h · Wind: ${season.windMs} m/s · RH: ${season.rhPct}% · Cloud cover: ${season.cloudPct}%</p>` : "<p>—</p>"}

        <h3>4. Shelter Geometry</h3>
        <p>Shape: ${s.design.shape} · Orientation: ${s.design.orientation}${s.design.orientation==="CUSTOM"?" ("+s.design.azimuthDeg+"° from South)":""} ·
        Dimensions: ${s.design.length}m × ${s.design.width}m × ${s.design.height}m</p>

        <h3>5–6. Material Specification &amp; Thermal Properties</h3>
        <table><tr><th>Element</th><th>Material</th><th>Thickness</th><th>U-value (W/m²K)</th></tr>
          <tr><td>Wall</td><td>${matName(s.design.wall.materialId)} + ${matName(s.design.wall.insulationMaterialId)}</td><td>${s.design.wall.thicknessMm}mm + ${s.design.wall.insulationThicknessMm}mm</td><td>${ENGINE.wallUValue(s.design).toFixed(3)}</td></tr>
          <tr><td>Roof</td><td>${matName(s.design.roof.materialId)} + ${matName(s.design.roof.insulationMaterialId)}</td><td>${s.design.roof.thicknessMm}mm + ${s.design.roof.insulationThicknessMm}mm</td><td>${ENGINE.roofUValue(s.design).toFixed(3)}</td></tr>
          <tr><td>Floor</td><td>${matName(s.design.floor.materialId)}</td><td>${s.design.floor.thicknessMm}mm</td><td>${ENGINE.floorUValue(s.design).toFixed(3)}</td></tr>
          <tr><td>Window</td><td>${matName(s.design.windows[0].glazingMaterialId)}</td><td>—</td><td>${ENGINE.windowUValue(s.design.windows[0]).toFixed(2)}</td></tr>
          <tr><td>Thermal mass</td><td>${s.design.thermalMass ? matName(s.design.thermalMass.materialId)+" ("+s.design.thermalMass.massKg+" kg)" : "None"}</td><td>—</td><td>—</td></tr>
        </table>

        <h3>7. Simulation Methodology</h3>
        <p>Two-node RC (indoor air + thermal mass) hourly energy-balance model. Solar gain via sol-air temperature
        (opaque surfaces) and SHGC-based transmission (glazing). Time step: ${s.simConfig.timeStepMinutes} min · Period: ${s.simConfig.periodType}.</p>

        <h3>8. Assumptions</h3>
        <ul>
          <li>Outside film coefficient fixed at 23 W/m²K, wind-adjusted infiltration.</li>
          <li>Ground temperature assumed equal to seasonal mean ambient unless overridden.</li>
          <li>Longwave sky radiation exchange not separately modelled (folded into sol-air simplification).</li>
          <li>PCM thermal mass modelled via elevated apparent specific heat over its melt band.</li>
        </ul>

        ${result ? `
        <h3>9–11. Solar Energy, Heat Transfer &amp; Indoor Temperature Prediction <span class="tag tag-model">Model Prediction</span></h3>
        <table>
          <tr><td>Solar heat gain</td><td class="num">${result.daily.solarKwh} kWh/day</td></tr>
          <tr><td>Wall / roof / floor / opening / ventilation loss</td><td class="num">${result.daily.wallLossKwh} / ${result.daily.roofLossKwh} / ${result.daily.floorLossKwh} / ${result.daily.openingLossKwh} / ${result.daily.ventLossKwh} kWh/day</td></tr>
          <tr><td>Net energy balance</td><td class="num">${result.daily.netKwh} kWh/day</td></tr>
          <tr><td>Predicted indoor temperature range</td><td class="num">${result.comfort.minIndoor} – ${result.comfort.maxIndoor} °C</td></tr>
        </table>
        <h3>12. Thermal Comfort Analysis</h3>
        <p>Comfort duration: ${result.comfort.comfortHoursPerDay} h/day (day ${result.comfort.dayComfortPct}%, night ${result.comfort.nightComfortPct}%).
        Thermal Comfort Score: <b>${result.scores.thermalComfortScore}/100</b>.</p>` : `<p><i>No simulation has been run yet for this report.</i></p>`}

        ${opt ? `
        <h3>13–15. Candidate Comparison, Optimization Results &amp; Recommended Design</h3>
        <p>${opt.candidatesEvaluated} candidate configurations evaluated. Recommended: <b>Design ${opt.recommended.label}</b> —
        ${opt.recommended.params.orient}-facing, ${matName(opt.recommended.design.wall.materialId)} wall,
        ${opt.recommended.params.insul}mm insulation, ${matName(opt.recommended.params.glz)} glazing at
        ${Math.round(opt.recommended.params.wpct*100)}% window area. Thermal score ${opt.recommended.score.total.toFixed(0)}/100,
        estimated cost ₹${opt.recommended.cost.toLocaleString("en-IN")}.</p>
        <h3>16. Sensitivity Analysis</h3>
        <p>See Optimization module for the ranked parameter-impact chart on this design.</p>` : `<p><i>No optimization run yet for this report.</i></p>`}

        <h3>17. Limitations</h3>
        <p>Climate inputs used here are ${s.climateSource ? s.climateSource.label.toLowerCase() : "user-provided"}, not
        field-measured. The thermal model is a simplified two-node transient RC network — it omits 3D conduction,
        detailed longwave radiation exchange, and moisture transport. Results are model predictions requiring
        engineering and field validation before construction decisions.</p>

        <h3>18. Engineering Validation Requirements</h3>
        <p>Before construction: (1) validate material properties against actual procured specifications: (2) instrument
        a pilot shelter and compare against the Validation module; (3) have a qualified structural/thermal engineer
        review the final design.</p>
      </div>`;

    U.on("#printBtn", "click", () => window.print(), root);
  };

  UI.renderEvaluator = function (root) {
    const s = STORE.get();
    const result = s.lastSimulationResult;
    const opt = s.lastOptimizationResult;

    root.innerHTML = `
      <h1>Design Intelligence Summary</h1>
      <p class="subtitle">A 2–3 minute overview for an evaluator: the problem, the model, and the recommended design.</p>

      <div class="grid grid-3" style="margin-bottom:16px;">
        <div class="card"><h3>Location</h3><div style="font-size:16px;font-weight:700;">${s.location ? U.esc(s.location.label) : "Not selected"}</div>
          <div class="hint">${s.location ? `${s.location.annualSolarKwhM2Yr} kWh/m²/yr · ${s.location.avgSunshineHoursDay}h sunshine/day · ${s.location.avgCloudFreeDays} clear days/yr` : ""}</div></div>
        <div class="card"><h3>Climate Severity (${s.seasonKey || "—"})</h3><div style="font-size:16px;font-weight:700;">${STORE.currentSeason() ? STORE.currentSeason().tMin + "°C to " + STORE.currentSeason().tMax + "°C" : "—"}</div>
          <div class="hint">High diurnal swing typical of Ladakh's cold high-altitude desert climate</div></div>
        <div class="card"><h3>Validation Status</h3><div style="font-size:16px;font-weight:700;">${s.validationDatasets.length ? s.validationDatasets.length + " dataset(s) compared" : "Not yet validated"}</div>
          <div class="hint">Field validation required before deployment</div></div>
      </div>

      ${result ? `
      <div class="grid grid-2" style="margin-bottom:16px;">
        <div class="card">
          <h3>Thermal Comfort Score</h3>
          <div style="display:flex; align-items:center; gap:20px;">
            <div id="evalGauge"></div>
            <div>
              <div>Solar utilization: <b>${result.scores.solarUtilizationPct}%</b></div>
              <div>Heat retention: <b>${result.scores.heatRetentionPct}%</b></div>
              <div>Heat loss: <b>${result.daily.totalLossKwh} kWh/day</b></div>
              <div>${opt ? `Optimization improvement: <b>+${(opt.recommended.score.total - opt.top[opt.top.length-1].score.total).toFixed(1)} pts</b> vs weakest evaluated candidate` : ""}</div>
            </div>
          </div>
        </div>
        <div class="card">
          <h3>Why This Design?</h3>
          <ul class="checklist">
            <li>High solar gain utilization (${result.scores.solarUtilizationPct}%)</li>
            <li>Reduced night-time heat loss via insulation (U-wall ${result.uValues.wall.toFixed(2)} W/m²K)</li>
            <li>Improved insulation on wall and roof</li>
            <li>Optimized opening area for the local solar/heat-loss trade-off</li>
            <li>${s.design.thermalMass ? "Thermal mass added for night-time heat release" : "Thermal mass not yet configured — see What-If Analysis"}</li>
            <li>Orientation set to ${s.design.orientation} for solar exposure</li>
          </ul>
        </div>
      </div>
      <div class="card"><h3>Recommended Shelter</h3>
        <p>${opt ? `Design ${opt.recommended.label} — ${opt.recommended.params.orient}-facing, ${matName(opt.recommended.design.wall.materialId)} wall
        with ${opt.recommended.params.insul}mm insulation, ${matName(opt.recommended.params.glz)} glazing, thermal score
        <b>${opt.recommended.score.total.toFixed(0)}/100</b>.` : "Run Optimization to generate a recommended configuration."}</p>
      </div>
      ` : `<div class="card"><p class="subtitle">Run a simulation (and optimization) to populate this summary.</p></div>`}
    `;
    if (result) CH.scoreGauge(U.qs("#evalGauge", root), result.scores.thermalComfortScore);
  };

  UI.renderSettings = function (root) {
    const s = STORE.get();
    root.innerHTML = `
      <h1>Settings</h1>
      <div class="grid grid-2">
        <div class="card">
          <h3>Mode</h3>
          <p>Simple Mode hides advanced engineering fields. Advanced Mode exposes full parameter control.
          Toggle in the sidebar.</p>
          <h3 style="margin-top:16px;">Units</h3>
          <ul class="assumption-list">
            ${Object.entries(CFG.UNITS).map(([k,v]) => `<li>${k}: <b>${v}</b></li>`).join("")}
          </ul>
        </div>
        <div class="card">
          <h3>Assumptions &amp; Limitations</h3>
          <ul class="assumption-list">
            <li>Transient (hourly RC) model, not steady-state.</li>
            <li>Outside film coefficient: 23 W/m²K, wind-adjusted infiltration.</li>
            <li>Sky longwave radiation folded into the sol-air simplification (no separate term).</li>
            <li>Ground temperature defaults to seasonal mean ambient unless overridden.</li>
            <li>Internal gains constant-per-hour unless an occupancy schedule is supplied.</li>
            <li>PCM modelled via elevated apparent specific heat over its melt band.</li>
            <li>Weather is user-provided or a labelled "Demo / illustrative" dataset — never field-measured.</li>
          </ul>
        </div>
      </div>
      <div class="card" style="margin-top:16px;">
        <h3>Project</h3>
        <div class="form-row"><label>Project name</label><input id="projNameInput" value="${U.esc(s.project.name)}"></div>
        <button class="btn btn-sm" id="saveProjNameBtn">Save name</button>
        <button class="btn btn-sm" id="resetProjectBtn" style="margin-left:8px;color:var(--bad);">Reset project (clears all data)</button>
      </div>
    `;
    U.on("#saveProjNameBtn", "click", () => { s.project.name = U.qs("#projNameInput", root).value; STORE.save(); window.APP.render(); }, root);
    U.on("#resetProjectBtn", "click", () => {
      if (confirm("This clears all simulations, designs, and validation data in this browser session. Continue?")) {
        STORE.reset(); window.APP.render();
      }
    }, root);
  };
})();
</script>

<script>
/* AreaTherm — router + bootstrap */
window.APP = (function () {
  const STORE = window.APP_STORE, ENGINE = window.APP_ENGINE, CFG = window.APP_CONFIG;
  const viewRoot = () => document.getElementById("viewRoot");

  const ROUTES = {
    dashboard: window.UI.renderDashboard,
    location: window.UI.renderLocation,
    designer: window.UI.renderDesigner,
    materials: window.UI.renderMaterials,
    simulation: window.UI.renderSimulation,
    optimization: window.UI.renderOptimization,
    whatif: window.UI.renderWhatIf,
    validation: window.UI.renderValidation,
    reports: window.UI.renderReport,
    evaluator: window.UI.renderEvaluator,
    settings: window.UI.renderSettings
  };

  function currentRoute() {
    const hash = location.hash.replace("#/", "");
    return ROUTES[hash] ? hash : "dashboard";
  }

  function render() {
    const route = currentRoute();
    document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("active", a.dataset.route === route));
    document.getElementById("projectName").textContent = STORE.get().project.name;
    ROUTES[route](viewRoot());
    document.body.classList.toggle("mode-advanced", STORE.get().mode === "ADVANCED");
  }

  function navigate(route) { location.hash = "#/" + route; }

  function toast(msg) {
    let t = document.getElementById("appToast");
    if (!t) {
      t = document.createElement("div");
      t.id = "appToast";
      t.style.cssText = "position:fixed;bottom:20px;right:24px;background:#152233;color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .3s;";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = "1";
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = "0"; }, 2600);
  }

  function showExplain(title, bodyHtml) {
    document.getElementById("explainTitle").textContent = title;
    document.getElementById("explainBody").innerHTML = bodyHtml;
    document.getElementById("explainModal").classList.remove("hidden");
  }

  function runLadakhDemo() {
    STORE.loadLadakhDemo("leh", "Winter");
    const s = STORE.get();
    s.design = STORE.defaultDesign();
    STORE.save();
    const season = STORE.currentSeason();
    const result = ENGINE.runSimulation(s.design, season, s.simConfig);
    STORE.recordSimulation(result);
    const opt = ENGINE.runOptimization(s.design, season, s.simConfig, s.weights);
    STORE.recordOptimization(opt);
    navigate("evaluator");
    toast("Ladakh demo loaded: climate → simulation → optimization complete.");
  }

  function init() {
    document.getElementById("brandName").textContent = CFG.APP_NAME;

    window.addEventListener("hashchange", render);
    document.getElementById("runLadakhDemoBtn").addEventListener("click", runLadakhDemo);
    document.getElementById("explainClose").addEventListener("click", () => document.getElementById("explainModal").classList.add("hidden"));
    document.getElementById("explainModal").addEventListener("click", (e) => { if (e.target.id === "explainModal") e.currentTarget.classList.add("hidden"); });

    document.getElementById("modeSimple").addEventListener("click", () => { STORE.get().mode = "SIMPLE"; STORE.save(); document.getElementById("modeSimple").classList.add("active"); document.getElementById("modeAdvanced").classList.remove("active"); render(); });
    document.getElementById("modeAdvanced").addEventListener("click", () => { STORE.get().mode = "ADVANCED"; STORE.save(); document.getElementById("modeAdvanced").classList.add("active"); document.getElementById("modeSimple").classList.remove("active"); render(); });

    if (STORE.get().mode === "ADVANCED") { document.getElementById("modeAdvanced").click(); }

    if (!location.hash) location.hash = "#/dashboard";
    render();
  }

  return { render, navigate, toast, showExplain, runLadakhDemo, init };
})();

window.APP.init();
</script>
